<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播录制 &amp; 转录</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a28;--surface3:#242440;--border:#2a2a45;--text:#e0e0f0;--text-dim:#8888aa;--accent:#ff4d6a;--accent2:#ffb347;--accent3:#6c5ce7;--green:#00e676;--radius:10px}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px}
.header{background:linear-gradient(135deg,#0a0a1a,#1a0a2e,#0a1a2e);border-bottom:1px solid var(--border);padding:40px 24px 32px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 50%,rgba(108,92,231,.06) 0%,transparent 50%),radial-gradient(circle at 70% 50%,rgba(255,77,106,.04) 0%,transparent 50%);pointer-events:none}
.header-content{max-width:1200px;margin:0 auto;position:relative;z-index:1}
.header h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:12px}
.header h1 .sub{font-size:14px;font-weight:400;color:var(--text-dim);-webkit-text-fill-color:var(--text-dim)}
.header .tabs{display:flex;gap:2px;margin-top:20px;background:var(--surface);border-radius:10px;padding:3px;width:fit-content}
.header .tab{padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text-dim);transition:all .2s;border:none;background:none}
.header .tab.active{background:var(--surface3);color:var(--text);font-weight:600}
.header .tab:hover:not(.active){color:var(--text)}
.stats-bar{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.stat-item{font-size:13px;color:var(--text-dim)}
.stat-item .num{color:var(--text);font-weight:700;font-size:16px}
.loading{text-align:center;padding:60px;color:var(--text-dim);font-size:15px}
.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent3);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{text-align:center;padding:40px;color:var(--accent);font-size:15px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.4}
/* Room cards */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:16px}
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all .25s}
.room-card:hover{border-color:var(--accent3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.room-card-header{padding:16px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;position:relative}
.room-card-header .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.room-card-header .status-dot.live{background:var(--accent);box-shadow:0 0 8px rgba(255,77,106,.5);animation:pulse 1.5s infinite}
.room-card-header .status-dot.offline{background:var(--text-dim)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.room-card-header .name{font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-card-header .badge{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--surface3);color:var(--text-dim);margin-left:4px}
.room-card-header .arrow{font-size:11px;color:var(--text-dim);transition:transform .25s}
.room-card-header .arrow.open{transform:rotate(180deg)}
.room-card-body{padding:0 18px 18px;border-top:1px solid var(--border);display:none}
.room-card-body.open{display:block}
.room-card-body .recording-info{font-size:12px;color:var(--text-dim);padding:12px 0 8px}
.room-card-body .recording-info .live-badge{display:inline-block;background:var(--accent);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;animation:pulse 1.5s infinite;margin-right:6px}
/* Transcript section */
.room-card-body .section-title{font-size:13px;font-weight:600;color:var(--text-dim);margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.transcript-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.transcript-item .t-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.transcript-item .t-header .t-arrow{font-size:9px;color:var(--text-dim);transition:transform .25s;flex-shrink:0}
.transcript-item .t-header .t-arrow.open{transform:rotate(90deg)}
.transcript-item .t-header .t-time{font-size:12px;color:var(--text);flex:1}
.transcript-item .t-header .t-duration{font-size:11px;color:var(--text-dim)}
.transcript-item .t-header .t-dl{font-size:11px;padding:3px 10px;border-radius:5px;background:var(--surface3);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;text-decoration:none;transition:all .2s}
.transcript-item .t-header .t-dl:hover{background:var(--accent3);border-color:var(--accent3);color:#fff}
.transcript-item .t-body{display:none;padding:0 12px 12px}
.transcript-item .t-body.open{display:block}
.transcript-item .t-body .txt-content{background:var(--surface);border-radius:6px;padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;max-height:300px;overflow-y:auto;color:var(--text)}
/* Search */
.search-bar{position:relative;margin-bottom:16px}
.search-bar input{width:100%;padding:12px 16px 12px 40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:var(--accent3)}
.search-bar input::placeholder{color:var(--text-dim)}
.search-bar .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px}
/* Files tab */
.file-list{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.file-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;text-decoration:none;color:var(--text);transition:all .2s;font-size:13px}
.file-item:hover{background:var(--surface2);border-color:var(--accent3)}
.file-item .file-icon{font-size:16px;flex-shrink:0}
.file-item .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .file-size{font-size:11px;color:var(--text-dim);flex-shrink:0}
.file-item .file-date{font-size:11px;color:var(--text-dim);flex-shrink:0}
</style>
</head>
<body>
<div class="header">
<div class="header-content">
<h1>🎬 直播监控 <span class="sub">Douyin Live Recorder</span></h1>
<div class="tabs">
<button class="tab active" data-tab="rooms" onclick="switchTab('rooms')">🏠 房间列表</button>
<button class="tab" data-tab="transcripts" onclick="switchTab('transcripts')">📝 转录文案</button>
</div>
<div class="stats-bar" id="statsBar"></div>
</div>
</div>

<div class="container">
<div class="loading" id="loading"><div class="spinner"></div>正在加载...</div>
<div class="error-msg hidden" id="errorMsg"></div>

<!-- Tab: rooms -->
<div id="tabRooms">
<div class="search-bar">
<span class="search-icon">🔍</span>
<input type="text" id="roomSearch" placeholder="搜索主播名称..." oninput="filterRooms()">
</div>
<div class="room-grid" id="roomGrid"></div>
</div>

<!-- Tab: transcripts -->
<div id="tabTranscripts" style="display:none">
<div class="search-bar">
<span class="search-icon">🔍</span>
<input type="text" id="transcriptSearch" placeholder="搜索主播或文案内容..." oninput="filterTranscripts()">
</div>
<div id="transcriptAnchorList"></div>
</div>
</div>

<script>
let roomsData = null;
let transcriptsData = null;
let allReleases = null;

async function init() {
try {
// rooms.txt from raw GitHub (always available)
let roomsList = [];
try {
const roomsRes = await fetch('https://raw.githubusercontent.com/tangwei880620-rgb/douyin-recorder/main/rooms.txt');
if (roomsRes.ok) {
const text = await roomsRes.text();
for (let line of text.split('\n')) {
line = line.trim();
if (!line || line.startsWith('#')) continue;
const eq = line.indexOf('=');
if (eq > 0) roomsList.push({ id: line.slice(0, eq).trim(), name: line.slice(eq + 1).trim() });
}
}
} catch(e) {}
// live_status.json (may not exist yet)
let liveMap = {};
try {
const liveRes = await fetch('https://raw.githubusercontent.com/tangwei880620-rgb/douyin-recorder/main/docs/live_status.json');
if (liveRes.ok) liveMap = await liveRes.json();
} catch(e) {}
roomsData = { live: liveMap, list: roomsList };
document.getElementById('loading').classList.add('hidden');
renderRooms();
loadTranscripts();
loadFiles();
} catch(e) {
document.getElementById('loading').classList.add('hidden');
const errEl = document.getElementById('errorMsg');
errEl.textContent = '加载失败: ' + e.message;
errEl.classList.remove('hidden');
}
}

function renderRooms() {
const grid = document.getElementById('roomGrid');
const data = roomsData;
const live = data.live || {};
let html = '';
for (let r of data.list) {
const info = live[r.id];
const isLive = info && info.live;
const isRec = info && info.recording;
const recStart = info && info.start_ts ? info.start_ts : null;
const checkedAt = info && info.checked_at ? info.checked_at : null;
const statusClass = isLive || isRec ? 'live' : 'offline';
const statusText = isRec ? '录制中' : (isLive ? '在线' : '离线');
const duration = recStart ? fmtDuration(Math.floor(Date.now()/1000) - recStart) : '';
html += '<div class="room-card">';
html += '<div class="room-card-header" onclick="toggleRoom(this)">';
html += '<span class="status-dot ' + statusClass + '"></span>';
html += '<span class="name">' + esc(r.name) + '</span>';
html += '<span class="badge">' + statusText + '</span>';
html += '<span class="arrow">▼</span>';
html += '</div>';
html += '<div class="room-card-body">';
html += '<div class="recording-info">';
if (isRec) html += '<span class="live-badge">🔴 直播中</span>' + '已录制 ' + duration;
else if (isLive) html += '⚠️ 在线但未录制';
else html += '🟤 当前未开播';
if (checkedAt) html += ' · 上次检测 ' + fmtTimeAgo(checkedAt);
html += '</div>';
html += '<div class="section-title">📄 录制文件</div><div id="files-' + r.id + '"><div class="loading" style="padding:20px"><div class="spinner"></div></div></div>';
html += '<div class="section-title">📝 转录文案</div><div id="tx-' + r.id + '"><div class="loading" style="padding:20px"><div class="spinner"></div></div></div>';
html += '</div></div>';
}
grid.innerHTML = html;
// Load files & transcripts for each room
for (let r of data.list) {
loadRoomFiles(r.id);
loadRoomTranscripts(r.id);
}
}

function loadRoomFiles(rid) {
const el = document.getElementById('files-' + rid);
if (!allReleases) { setTimeout(() => loadRoomFiles(rid), 500); return; }
const roomRel = allReleases.filter(r => r.tag.includes(rid) && (r.tag.endsWith('.mp4') || r.tag.endsWith('.wav')));
if (roomRel.length === 0) {
el.innerHTML = '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">暂无录制文件</div>';
return;
}
let html = '<div class="file-list">';
for (let r of roomRel.slice(-10).reverse()) {
const isWav = r.tag.endsWith('.wav');
const isMp4 = r.tag.endsWith('.mp4');
const icon = isWav ? '🎵' : (isMp4 ? '🎬' : '📁');
const date = r.created_at.slice(5, 16);
const assetUrl = r.html_url + '/download/' + r.tag_name;
html += '<a class="file-item" href="' + assetUrl + '" target="_blank">';
html += '<span class="file-icon">' + icon + '</span>';
html += '<span class="file-name">' + esc(r.tag_name.slice(0, 50)) + '</span>';
html += '<span class="file-date">' + date + '</span>';
html += '</a>';
}
html += '</div>';
el.innerHTML = html;
}

async function loadTranscripts() {
try {
const res = await fetch('https://raw.githubusercontent.com/tangwei880620-rgb/douyin-recorder/main/docs/transcripts_index.json');
if (!res.ok) throw new Error('HTTP ' + res.status);
transcriptsData = await res.json();
renderTranscripts();
} catch(e) {
// transcripts unavailable - ok
}
}

function renderTranscripts() {
const list = document.getElementById('transcriptAnchorList');
const data = transcriptsData;
if (!data || !data.anchors || data.anchors.length === 0) {
list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>暂无转录数据</div></div>';
return;
}
let html = '';
for (let anchor of data.anchors) {
const items = anchor.transcripts;
html += '<div class="room-card" style="margin-bottom:16px">';
html += '<div class="room-card-header" onclick="toggleRoom(this)">';
html += '<span class="name">' + esc(anchor.name) + '</span>';
html += '<span class="badge">' + items.length + ' 条</span>';
html += '<span class="arrow">▼</span>';
html += '</div>';
html += '<div class="room-card-body">';
for (let item of items) {
const startFmt = fmtTS(item.start);
html += '<div class="transcript-item">';
html += '<div class="t-header" onclick="toggleTranscript(this)">';
html += '<span class="t-arrow">▶</span>';
html += '<span class="t-time">' + startFmt + '</span>';
if (item.end) html += '<span class="t-duration">→ ' + fmtTS(item.end) + '</span>';
html += '<a class="t-dl" href="' + item.url + '" target="_blank" onclick="event.stopPropagation()">下载</a>';
html += '</div>';
html += '<div class="t-body"><div class="txt-content" data-url="' + item.url + '">加载中...</div></div>';
html += '</div>';
}
html += '</div></div>';
}
list.innerHTML = html;
updateStats();
}

function loadRoomTranscripts(rid) {
const el = document.getElementById('tx-' + rid);
if (!transcriptsData) { setTimeout(() => loadRoomTranscripts(rid), 500); return; }
const anchor = transcriptsData.anchors.find(a => a.id === rid);
if (!anchor || anchor.transcripts.length === 0) {
el.innerHTML = '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">暂无转录</div>';
return;
}
let html = '';
for (let item of anchor.transcripts.slice(-5).reverse()) {
const startFmt = fmtTS(item.start);
html += '<div class="transcript-item">';
html += '<div class="t-header" onclick="toggleTranscript(this)">';
html += '<span class="t-arrow">▶</span>';
html += '<span class="t-time">' + startFmt + '</span>';
if (item.end) html += '<span class="t-duration">→ ' + fmtTS(item.end) + '</span>';
html += '<a class="t-dl" href="' + item.url + '" target="_blank" onclick="event.stopPropagation()">下载</a>';
html += '</div>';
html += '<div class="t-body"><div class="txt-content" data-url="' + item.url + '">加载中...</div></div>';
html += '</div>';
}
el.innerHTML = html;
}

async function loadFiles() {
try {
const res = await fetch('https://api.github.com/repos/tangwei880620-rgb/douyin-recorder/releases?per_page=100');
if (!res.ok) throw new Error('HTTP ' + res.status);
allReleases = await res.json();
} catch(e) {}
}

function switchTab(name) {
document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
document.getElementById('tabRooms').style.display = name === 'rooms' ? '' : 'none';
document.getElementById('tabTranscripts').style.display = name === 'transcripts' ? '' : 'none';
}

function filterRooms() {
const q = document.getElementById('roomSearch').value.toLowerCase();
document.querySelectorAll('.room-card').forEach(card => {
const name = card.querySelector('.name').textContent.toLowerCase();
card.style.display = !q || name.includes(q) ? '' : 'none';
});
}

function filterTranscripts() {
const q = document.getElementById('transcriptSearch').value.toLowerCase();
document.querySelectorAll('#transcriptAnchorList > .room-card').forEach(card => {
const name = card.querySelector('.name').textContent.toLowerCase();
let match = !q || name.includes(q);
if (!match && q) {
const items = card.querySelectorAll('.txt-content');
for (let item of items) {
if (item.textContent.toLowerCase().includes(q)) { match = true; break; }
}
}
card.style.display = match ? '' : 'none';
});
}

function toggleRoom(el) {
el.querySelector('.arrow').classList.toggle('open');
el.nextElementSibling.classList.toggle('open');
}

function toggleTranscript(el) {
el.querySelector('.t-arrow').classList.toggle('open');
const body = el.nextElementSibling;
body.classList.toggle('open');
if (body.classList.contains('open')) {
const contentDiv = body.querySelector('.txt-content');
if (contentDiv && contentDiv.textContent === '加载中...') {
const url = contentDiv.dataset.url;
fetch(url).then(r => r.text()).then(txt => {
contentDiv.textContent = txt;
}).catch(() => {
contentDiv.textContent = '（加载失败）';
});
}
}
}

function updateStats() {
const bar = document.getElementById('statsBar');
if (!transcriptsData) return;
let roomCount = 0, txCount = 0;
if (roomsData) roomCount = roomsData.list.length;
if (transcriptsData) txCount = transcriptsData.transcript_count;
const liveCount = roomsData ? Object.values(roomsData.live).filter(v => v.live || v.recording).length : 0;
bar.innerHTML =
'<span class="stat-item">监控房间: <span class="num">' + roomCount + '</span></span>' +
'<span class="stat-item">在线: <span class="num">' + liveCount + '</span></span>' +
'<span class="stat-item">转录文件: <span class="num">' + txCount + '</span></span>';
}

function esc(s) {
const d = document.createElement('div');
d.textContent = s;
return d.innerHTML;
}

function fmtTS(ts) {
if (!ts) return '';
if (ts.length >= 15) return ts.slice(0,4) + '-' + ts.slice(4,6) + '-' + ts.slice(6,8) + ' ' + ts.slice(9,11) + ':' + ts.slice(11,13);
return ts;
}

function fmtDuration(sec) {
const h = Math.floor(sec / 3600);
const m = Math.floor((sec % 3600) / 60);
if (h > 0) return h + '时' + m + '分';
return m + '分';
}

function fmtTimeAgo(ts) {
const sec = Math.floor(Date.now() / 1000 - ts);
if (sec < 60) return '刚刚';
if (sec < 3600) return Math.floor(sec/60) + '分钟前';
if (sec < 86400) return Math.floor(sec/3600) + '小时前';
return Math.floor(sec/86400) + '天前';
}

init();
</script>
</body>
</html>
