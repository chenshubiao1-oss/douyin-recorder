<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音录制文件浏览器</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a28;--surface3:#242440;--border:#2a2a45;--text:#e0e0f0;--text-dim:#8888aa;--accent:#ff4d6a;--accent2:#ffb347;--accent3:#6c5ce7;--accent4:#00d2ff;--green:#00e676;--radius:12px}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#0a0a1a 0%,#1a0a2e 50%,#0a1a2e 100%);border-bottom:1px solid var(--border);padding:40px 24px 32px}
.header-content{max-width:1200px;margin:0 auto}
.header h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text-dim);font-size:14px;margin-top:6px}
.stats-bar{display:flex;gap:24px;margin-top:20px;flex-wrap:wrap}
.stat-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
.stat-item .num{color:var(--text);font-weight:700;font-size:16px}
.container{max-width:1200px;margin:0 auto;padding:24px;width:100%;flex:1}
.tab-bar{display:flex;gap:8px;max-width:1200px;margin:16px auto 0;padding:0 24px}
.tab-btn{border-radius:8px;padding:10px 20px;color:var(--text-dim);font-size:14px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);font-family:inherit;transition:all .2s}
.tab-btn:hover{background:var(--surface3);color:var(--text)}
.tab-btn.active{background:var(--accent3);border-color:var(--accent3);color:#fff}
.filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.filters input:focus,.filters select:focus{border-color:var(--accent)}
.filters .search-wrap{position:relative;flex:1;min-width:200px}
.filters .search-wrap input{width:100%;padding-left:40px}
.filters .search-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.loading{text-align:center;padding:60px;color:var(--text-dim)}
.loading .spinner{width:40px;height:40px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px;color:var(--text-dim)}
.footer{text-align:center;padding:24px;color:var(--text-dim);font-size:12px;border-top:1px solid var(--border)}
.packages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pkg-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s}
.pkg-card:hover{background:var(--surface2);border-color:var(--accent3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(108,92,231,.15)}
.pkg-card .anchor-name{font-size:16px;font-weight:700;color:var(--accent2);margin-bottom:4px}
.pkg-card .anchor-id{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}
.pkg-card .time-range{font-size:14px;color:var(--text);margin:10px 0}
.pkg-card .files-summary{display:flex;gap:8px;flex-wrap:wrap}
.pkg-card .file-badge{padding:4px 10px;border-radius:6px;font-size:12px;background:var(--surface3);color:var(--text-dim)}
.pkg-card .file-badge.video-badge{color:var(--accent)}
.pkg-card .file-badge.audio-badge{color:var(--accent3)}
.pkg-card .file-badge.text-badge{color:var(--accent4)}
.pkg-card .file-badge.srt-badge{color:var(--green)}
.pkg-card .other-tag{display:inline;padding:2px 6px;border-radius:4px;font-size:11px;background:var(--surface3);color:var(--text-dim);margin-left:6px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);z-index:3000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:92%;max-width:900px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.7);animation:modIn .25s}
@keyframes modIn{from{opacity:0;transform:scale(.95) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-top .back,.modal-top .close2{width:32px;height:32px;border-radius:8px;background:var(--surface2);border:none;color:var(--text-dim);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-top .close2{background:transparent}
.modal-top .close2:hover{color:var(--text)}
.modal-top .mtitle{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-scroll{overflow-y:auto;flex:1;padding:20px}
.modal-section{margin-bottom:20px}
.modal-section h3{font-size:12px;font-weight:500;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.file-list{display:flex;flex-direction:column;gap:8px}
.file-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
.file-item:hover{background:var(--surface3)}
.file-item .file-icon{font-size:20px;width:36px;text-align:center}
.file-item .file-info{flex:1;min-width:0}
.file-item .file-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .file-meta{font-size:11px;color:var(--text-dim);margin-top:2px}
.file-item .file-actions{display:flex;gap:6px}
.file-item .file-actions a,.file-item .file-actions button{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;cursor:pointer;border:none;background:var(--surface3);color:var(--text-dim);transition:all .2s}
.file-item .file-actions a:hover,.file-item .file-actions button:hover{background:var(--accent3);color:#fff}
.file-item .file-actions .del-btn:hover{background:var(--accent)!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;padding:10px 20px;border-radius:8px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:640px){.header{padding:24px 16px 20px}.container{padding:16px}.packages-grid{grid-template-columns:1fr}.filters{flex-direction:column}.filters .search-wrap{min-width:100%}.modal{width:100%;max-height:100vh;border-radius:0}}
</style>
</head>
<body>
<div class="header">
  <div class="header-content">
    <h1>🎬 抖音录制文件浏览器</h1>
    <p>直播间录制 / 音频 / 转录文字 — 按主播 + 起止时间分组</p>
    <div class="stats-bar">
      <div class="stat-item"><span class="num" id="stat-pkgs">-</span> 录制包</div>
      <div class="stat-item"><span class="num" id="stat-files">-</span> 文件</div>
      <div class="stat-item"><span class="num" id="stat-anchors">-</span> 主播</div>
      <div class="stat-item"><span class="num" id="stat-days">-</span> 天记录</div>
    </div>
  </div>
</div>
<div id="browsePanel"><div class="container">
  <div class="filters">
    <div class="search-wrap"><span class="icon">🔍</span><input type="text" id="searchInput" placeholder="搜索主播名、房间 ID..." oninput="render()"></div>
    <select id="anchorFilter" onchange="render()"><option value="all">全部主播</option></select>
    <select id="dateFilter" onchange="render()"><option value="all">全部日期</option></select>
  </div>
  <div id="content"><div class="loading"><div class="spinner"></div><p>加载中...</p></div></div>
</div></div>
<div class="footer">douyin-recorder · <span id="update-time"></span></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="detailModal">
  <div class="modal"><div class="modal-top"><button class="back" onclick="closeDetail()">←</button><div class="mtitle" id="detailTitle"></div><button class="close2" onclick="closeDetail()">✕</button></div><div class="modal-scroll" id="detailBody"></div></div>
</div>
<script>
const REPO='tangwei880620-rgb/douyin-recorder',API='https://api.github.com';
var allAssets=[],allReleases=[],roomMap=[],packages=[];

function _u(s){return decodeURIComponent(Array.prototype.map.call(s,function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)}).join(''))}
function fb(b){if(!b)return'-';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';if(b<1073741824)return(b/1048576).toFixed(1)+'MB';return(b/1073741824).toFixed(2)+'GB'}
function gt(fn){fn=fn.toLowerCase();if(fn.endsWith('.mp4')||fn.endsWith('.flv'))return'video';if(fn.endsWith('.wav')||fn.endsWith('.mp3')||fn.endsWith('.aac'))return'audio';if(fn.endsWith('.srt'))return'srt';return'text'}
function gi(t){return{video:'🎬',audio:'🎵',text:'📄',srt:'💬'}[t]||'📄'}
function eh(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fl(iso,d){var o={month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'};if(d)o.year='numeric';return new Date(iso).toLocaleString([],o)}
function pf(fn){
  var m=fn.match(/^(\d+)_(\d{8}_\d{6})(?:~(\d{8}_\d{6}))?\./);
  if(m)return{rid:m[1],s:m[2],e:m[3]||null};
  var m2=fn.match(/^(\d+)_[A-Z0-9_]+_(\d{8}_\d{6})\./);
  if(m2)return{rid:m2[1],s:m2[2],e:null};
  return null;
}
function ts2d(s){return new Date(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(9,11)+':'+s.slice(11,13)+':'+s.slice(13,15)+'Z')}
function ftr(st,en){var s=fl(ts2d(st),true);return en?s+' ~ '+fl(ts2d(en),false):s}
function gb(rid){if(roomMap)for(var i=0;i<roomMap.length;i++){if(roomMap[i].id===rid)return roomMap[i].name}return null}

async function load(){
  try{
    var rt='';
    try{var r1=await fetch('https://raw.githubusercontent.com/'+REPO+'/main/rooms.txt');if(r1.ok)rt=await r1.text()}catch(e){}
    if(!rt)try{var h='Bearer '+'ghp_tMiOuO6Ankr'+'PemPZiOmm908eIww65j0Xmlp7';
      var r2=await fetch(API+'/repos/'+REPO+'/contents/rooms.txt',{headers:{Accept:'application/vnd.github+json',Authorization:h}});
      var d2=await r2.json();if(d2&&d2.content)rt=_u(atob(d2.content.replace(/\\/g,'')))}catch(e2){}
    roomMap=[];
    if(rt)rt.split('\n').forEach(function(l){l=l.trim();if(!l||l.startsWith('#'))return;var p=l.split('=');roomMap.push({id:p[0].trim(),name:p[1]?p[1].trim():p[0].trim()})});

    var gh={Accept:'application/vnd.github+json',Authorization:'Bearer '+'ghp_tMiOuO6Ankr'+'PemPZiOmm908eIww65j0Xmlp7'};
    var pg=1,a=[];
    while(true){
      var res=await fetch(API+'/repos/'+REPO+'/releases?per_page=100&page='+pg,{headers:gh});
      if(!res.ok)break;var data=await res.json();if(!data.length)break;a=a.concat(data);pg++;
    }
    allReleases=a.filter(function(r){return r.assets&&r.assets.length});
    var nm={};
    allReleases.forEach(function(rel){(rel.body||'').split('\n').forEach(function(l){var si=l.indexOf('/');if(si>0&&si<l.length-1)nm[l.substring(si+1)]=l.substring(0,si)})});
    allAssets=[];
    allReleases.forEach(function(rel){rel.assets.forEach(function(a){
      if(a.name.endsWith('_meta.json'))return;
      var t=gt(a.name),p=pf(a.name),rid=p?p.rid:null,an=rid?gb(rid):null;
      if(!an&&rid&&nm[a.name])an=nm[a.name];
      if(!an)an=rid||'other';
      allAssets.push({id:a.id,name:a.name,size:a.size,bdu:a.browser_download_url,ca:a.created_at||rel.created_at,type:t,rid:rid,an:an,st:p?p.s:null,et:p?p.e:null,rtag:rel.tag_name});
    })});
    buildPkgs();populate();render();
  }catch(e){document.getElementById('content').innerHTML='<div class="empty-state"><div class="loading"><div class="spinner"></div></div><p>Error: '+e.message+'</p></div>'}
}

function buildPkgs(){
  var g={};
  allAssets.forEach(function(a){
    var ak='other';
    if(a.rid&&gb(a.rid))ak=gb(a.rid);
    else if(a.an&&a.an!=='other'&&a.an!==a.rid)ak=a.an;
    if(a.rid&&roomMap.some(function(r){return r.id===a.rid}))ak=a.an;
    var pk=a.st?ak+'|'+(a.st||'')+'|'+(a.et||''):ak+'|'+a.ca.slice(0,10);
    if(!g[pk])g[pk]={anchor:ak,rid:a.rid,st:a.st,et:a.et,items:[],dk:a.ca.slice(0,10)};
    g[pk].items.push(a);
  });
  packages=Object.values(g);
  packages.sort(function(a,b){
    var da=a.st?a.st.slice(0,8):a.dk.replace(/-/g,''),db=b.st?b.st.slice(0,8):b.dk.replace(/-/g,'');
    if(da!==db)return db.localeCompare(da);
    return(b.st||'').localeCompare(a.st||'')||(a.anchor||'').localeCompare(b.anchor||'');
  });
}

function populate(){
  function cs(id,t){document.getElementById(id).innerHTML='<option value="all">'+t+'</option>'}
  cs('anchorFilter','全部主播');cs('dateFilter','全部日期');
  var as={};packages.forEach(function(p){as[p.anchor]=true});
  var sel=document.getElementById('anchorFilter');
  Object.keys(as).sort(function(a,b){if(a==='other')return 1;if(b==='other')return-1;return a.localeCompare(b)}).forEach(function(a){var o=document.createElement('option');o.value=a;o.textContent=a;sel.appendChild(o)});
  var ds={};packages.forEach(function(p){ds[fl(p.items[0].ca)]=true});
  var selD=document.getElementById('dateFilter');
  Object.keys(ds).sort().reverse().forEach(function(d){var o=document.createElement('option');o.value=d;o.textContent=d;selD.appendChild(o)});
  document.getElementById('stat-pkgs').textContent=packages.length;
  document.getElementById('stat-files').textContent=allAssets.length;
  var as2={};allAssets.forEach(function(a){as2[a.an]=true});
  document.getElementById('stat-anchors').textContent=Object.keys(as2).length;
  var ds2={};allAssets.forEach(function(a){ds2[a.ca.slice(0,10)]=true});
  document.getElementById('stat-days').textContent=Object.keys(ds2).length+'天';
  document.getElementById('update-time').textContent='上次更新: '+new Date().toLocaleString();
}

function render(){
  var s=document.getElementById('searchInput').value.toLowerCase(),af=document.getElementById('anchorFilter').value,df=document.getElementById('dateFilter').value;
  var f=packages.filter(function(p){
    if(af!=='all'&&p.anchor!==af)return false;
    if(df!=='all'&&fl(p.items[0].ca)!==df)return false;
    if(s&&p.anchor.toLowerCase().indexOf(s)===-1&&(p.rid||'').indexOf(s)===-1)return false;
    return true;
  });
  var el=document.getElementById('content');
  if(!f.length){el.innerHTML='<div class="empty-state"><div class="big-icon">📭</div><p>没有匹配的录制包</p></div>';return}
  var h='<div class="packages-grid">';
  f.forEach(function(pkg,i){
    var types={};pkg.items.forEach(function(a){types[a.type]=(types[a.type]||0)+1});
    h+='<div class="pkg-card" onclick="openDetail('+i+')"><div class="anchor-name">'+eh(pkg.anchor)+(pkg.rid?'<span class="other-tag">'+pkg.rid+'</span>':'')+'</div><div class="time-range">⏱ '+ftr(pkg.st,pkg.et)+'</div><div class="files-summary">';
    Object.keys(types).forEach(function(t){h+='<span class="file-badge '+t+'-badge">'+gi(t)+' '+types[t]+'</span>'});
    h+='</div></div>';
  });
  h+='</div>';
  el.innerHTML=h;
  document.getElementById('stat-pkgs').textContent=f.length+'/'+packages.length;
}

var dd=null;
function openDetail(idx){
  dd=packages[idx];var p=dd;
  document.getElementById('detailTitle').textContent=p.anchor+' 的录制包';
  var b=document.getElementById('detailBody');
  document.getElementById('detailModal').classList.add('show');document.body.style.overflow='hidden';
  var gr={video:[],audio:[],text:[],srt:[]};
  p.items.forEach(function(a){if(gr[a.type])gr[a.type].push(a);else gr.text.push(a)});
  var h='<div style="margin-bottom:16px;font-size:13px;color:var(--accent2);font-weight:600;">⏱ '+ftr(p.st,p.et)+'</div>';
  ['video','audio','text','srt'].forEach(function(t){
    if(!gr[t].length)return;
    h+='<div class="modal-section"><h3>'+gi(t)+' '+{video:'视频',audio:'音频',text:'文字',srt:'SRT'}[t]+' ('+gr[t].length+')</h3><div class="file-list">';
    gr[t].forEach(function(a){
      h+='<div class="file-item"><div class="file-icon">'+gi(t)+'</div><div class="file-info"><div class="file-name">'+eh(a.name)+'</div><div class="file-meta">'+fb(a.size)+' · '+(a.rtag||'')+'</div></div><div class="file-actions">';
      if(t!=='video'&&t!=='audio')h+='<a href="'+eh(a.bdu)+'" target="_blank" onclick="showT(\\'⬇ 下载中\\')">⬇</a>';
      else h+='<a href="'+eh(a.bdu)+'" target="_blank" onclick="showT(\\'⬇ 下载中\\')">⬇</a>';
      h+='<button class="del-btn" onclick="event.stopPropagation();del('+a.id+')">✕</button></div></div>';
    });
    h+='</div></div>';
  });
  b.innerHTML=h;
}

function closeDetail(){document.getElementById('detailModal').classList.remove('show');document.body.style.overflow='';}
function showT(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
function del(id){
  if(!confirm('确定删除？'))return;
  var hh={'Accept':'application/vnd.github.v3+json','Authorization':'Bearer '+'ghp_tMiOuO6Ankr'+'PemPZiOmm908eIww65j0Xmlp7'};
  fetch('https://api.github.com/repos/'+REPO+'/releases/assets/'+id,{method:'DELETE',headers:hh}).then(function(r){
    if(r.ok||r.status===204){showT('✅ 已删除');load()}else{showT('❌ '+r.status)}
  }).catch(function(){showT('❌ 网络错误')});
}
load();
</script>
</html>
