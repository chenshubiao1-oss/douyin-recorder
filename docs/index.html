<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音录制文件浏览器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a28;
  --surface3: #242440;
  --border: #2a2a45;
  --text: #e0e0f0;
  --text-dim: #8888aa;
  --accent: #ff4d6a;
  --accent2: #ffb347;
  --accent3: #6c5ce7;
  --accent4: #00d2ff;
  --green: #00e676;
  --radius: 12px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
}

body {
  font-family: 'Noto Sans SC', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
  border-bottom: 1px solid var(--border);
  padding: 40px 24px 32px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 20% 50%, rgba(108,92,231,0.08) 0%, transparent 50%),
              radial-gradient(circle at 80% 50%, rgba(255,77,106,0.06) 0%, transparent 50%);
  pointer-events: none;
}
.header-content { position: relative; max-width: 1200px; margin: 0 auto; }
.header h1 {
  font-size: 28px; font-weight: 900;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header p { color: var(--text-dim); font-size: 14px; margin-top: 6px; }
.stats-bar { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; }
.stat-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }
.stat-item .num { color: var(--text); font-weight: 700; font-size: 16px; }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; width: 100%; flex: 1; }

.filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 16px; color: var(--text); font-size: 14px; font-family: 'Noto Sans SC', sans-serif;
  outline: none; transition: border-color 0.2s;
}
.filters input:focus, .filters select:focus { border-color: var(--accent); }
.filters input::placeholder { color: var(--text-dim); }
.filters .search-wrap { position: relative; flex: 1; min-width: 200px; }
.filters .search-wrap input { width: 100%; padding-left: 40px; }
.filters .search-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; }

.anchor-section { margin-bottom: 32px; }
.anchor-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 10px; padding: 10px 12px;
  background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
}
.anchor-header .avatar {
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; flex-shrink: 0;
}
.anchor-header .info { flex: 1; }
.anchor-header .info .name { font-size: 15px; font-weight: 700; }
.anchor-header .info .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.anchor-header .info .sub .tag { display: inline-block; padding: 0 6px; background: var(--surface3); border-radius: 4px; margin-right: 4px; font-size: 11px; }

.file-list { display: flex; flex-direction: column; gap: 6px; }
.file-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: var(--surface); border: 1px solid transparent; border-radius: 8px;
  transition: all 0.2s; cursor: default;
}
.file-row:hover { background: var(--surface2); border-color: var(--border); }
.file-row .icon-badge {
  width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
}
.file-row.icon-video .icon-badge { background: rgba(255,77,106,0.15); }
.file-row.icon-audio .icon-badge { background: rgba(108,92,231,0.15); }
.file-row.icon-text  .icon-badge { background: rgba(0,210,255,0.15); }
.file-row.icon-srt   .icon-badge { background: rgba(0,230,118,0.15); }
.file-row .fmeta { flex: 1; min-width: 0; }
.file-row .fmeta .fname { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-row .fmeta .fsub { font-size: 11px; color: var(--text-dim); margin-top: 2px; display: flex; align-items: center; gap: 8px; }
.file-row .fmeta .fsub .fsize { font-family: 'JetBrains Mono', monospace; }
.file-row .fmeta .fsub .release-tag { color: var(--accent2); }
.file-row a.dl {
  padding: 6px 14px; border-radius: 6px; background: var(--accent3); color: #fff; text-decoration: none;
  font-size: 12px; font-weight: 500; transition: background 0.2s; flex-shrink: 0;
}
.file-row a.dl:hover { background: #5a4bd1; }
.file-row a.dl:active { transform: scale(0.97); }

.loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.loading .spinner {
  width: 40px; height: 40px; border: 3px solid var(--surface2); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }

.footer { text-align: center; padding: 24px; color: var(--text-dim); font-size: 12px; border-top: 1px solid var(--border); }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--green); color: #000; padding: 10px 20px; border-radius: 8px;
  font-size: 13px; font-weight: 500; z-index: 2000;
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }

@media (max-width: 640px) {
  .header { padding: 24px 16px 20px; }
  .container { padding: 16px; }
  .filters { flex-direction: column; }
  .filters .search-wrap { min-width: 100%; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-content">
    <h1>🎬 抖音录制文件浏览器</h1>
    <p>直播间录制 / 音频 / 转录文字 — 按主播分组浏览</p>
    <div class="stats-bar">
      <div class="stat-item"><span class="num" id="stat-files">-</span> 文件</div>
      <div class="stat-item"><span class="num" id="stat-anchors">-</span> 主播</div>
      <div class="stat-item"><span class="num" id="stat-days">-</span> 天记录</div>
    </div>
  </div>
</div>

<div class="container">
  <div class="filters">
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索主播名、文件名..." oninput="renderFiles()">
    </div>
    <select id="typeFilter" onchange="renderFiles()">
      <option value="all">全部类型</option>
      <option value="video">🎬 视频</option>
      <option value="audio">🎵 音频</option>
      <option value="text">📄 文字</option>
      <option value="srt">💬 SRT</option>
    </select>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p>加载中，正在查询 GitHub API...</p>
    </div>
  </div>
</div>

<div class="footer">douyin-recorder · <span id="update-time"></span></div>

<div class="toast" id="toast"></div>

<script>
const REPO = 'tangwei880620-rgb/douyin-recorder';
const API = 'https://api.github.com';
let allAssets = [];

function fmtSize(bytes) {
  if (!bytes) return '-';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(2) + ' GB';
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}

/** Extract anchor nickname from filename like:
 *  "越南女婿果子的抖音直播间直播_FULL_HD1_20260514_084451.mp4"
 *  "东哥闯越南-东阜的抖音直播间直播_FULL_HD1_20260514_084446.wav"
 *  "火火在越南88888（珍）的抖音直播间直播_FULL_HD1_20260514_080557.wav"
 */
function extractNickname(name) {
  let n = name.replace(/\.\w+$/, ''); // remove extension
  // Remove FULL_HD suffix
  n = n.replace(/_(FULL_HD\d?|HD\d?)/g, '');
  // Remove trailing datetime _YYYYMMDD_HHMMSS
  n = n.replace(/_\d{8}_\d{6}$/, '');
  // Remove "的抖音直播间直播" or "的抖音直播间"
  n = n.replace(/的抖音直播间直播$/, '').replace(/的抖音直播间$/, '');
  // Remove "（珍）" etc
  n = n.replace(/[（(].*?[）)]/g, '');
  // Remove room id patterns (pure digits at end)
  n = n.replace(/\d{6,}$/, '');
  return n.trim() || name;
}

function getType(filename) {
  const f = filename.toLowerCase();
  if (f.endsWith('.mp4') || f.endsWith('.flv') || f.endsWith('.webm') || f.endsWith('.mkv')) return 'video';
  if (f.endsWith('.wav') || f.endsWith('.mp3') || f.endsWith('.aac') || f.endsWith('.ogg')) return 'audio';
  if (f.endsWith('.srt')) return 'srt';
  return 'text';
}

function getIcon(type) {
  return { video: '🎬', audio: '🎵', text: '📄', srt: '💬' }[type] || '📄';
}

function getReleaseTag(name) {
  // Try to extract date from filename for grouping by day
  const m = name.match(/_(\d{8})_/);
  return m ? m[1] : null;
}

async function loadData() {
  try {
    let page = 1;
    let all = [];
    while (true) {
      const resp = await fetch(`${API}/repos/${REPO}/releases?per_page=100&page=${page}`);
      if (!resp.ok) break;
      const data = await resp.json();
      if (data.length === 0) break;
      all = all.concat(data);
      page++;
    }
    const releases = all.filter(r => r.assets && r.assets.length > 0);

    allAssets = [];
    for (const rel of releases) {
      for (const asset of rel.assets) {
        const type = getType(asset.name);
        const nickname = extractNickname(asset.name);
        allAssets.push({
          id: asset.id,
          name: asset.name,
          size: asset.size,
          url: asset.browser_download_url,
          created_at: asset.created_at || rel.created_at,
          type,
          nickname,
          release_tag: rel.tag_name,
          date: getReleaseTag(asset.name) || rel.created_at.slice(0,10).replace(/-/g,''),
        });
      }
    }

    // Sort by date descending
    allAssets.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    document.getElementById('stat-files').textContent = allAssets.length;
    document.getElementById('stat-anchors').textContent = [...new Set(allAssets.map(a => a.nickname))].length;
    document.getElementById('stat-days').textContent = new Set(allAssets.map(a => a.date)).size;
    document.getElementById('update-time').textContent = '上次更新: ' + new Date().toLocaleString('zh-CN');

    renderFiles();
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty-state"><div class="big-icon">❌</div><p>加载失败: ${e.message}</p></div>`;
  }
}

function renderFiles() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const typeFilter = document.getElementById('typeFilter').value;

  let filtered = allAssets.filter(a => {
    if (typeFilter !== 'all' && a.type !== typeFilter) return false;
    if (search && !a.name.toLowerCase().includes(search) && !a.nickname.toLowerCase().includes(search)) return false;
    return true;
  });

  // Group by nickname
  const groups = {};
  filtered.forEach(a => {
    const key = a.nickname;
    if (!groups[key]) groups[key] = [];
    groups[key].push(a);
  });

  // Sort anchors by most recent file
  const sorted = Object.entries(groups).sort((a, b) => {
    const latestA = Math.max(...a[1].map(x => new Date(x.created_at)));
    const latestB = Math.max(...b[1].map(x => new Date(x.created_at)));
    return latestB - latestA;
  });

  const content = document.getElementById('content');
  if (sorted.length === 0) {
    content.innerHTML = `<div class="empty-state"><div class="big-icon">📭</div><p>没有找到匹配的文件</p></div>`;
    return;
  }

  // Assign avatar colors based on nickname hash
  function getAvatarColor(name) {
    const colors = ['#ff4d6a','#ffb347','#6c5ce7','#00d2ff','#00e676','#ff6b6b','#48dbfb','#f368e0','#ff9ff3','#54a0ff','#5f27cd','#01a3a4'];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }

  function getInitials(name) {
    // Take first Chinese character or first letter
    const m = name.match(/^([\u4e00-\u9fa5])/);
    return m ? m[1] : name.charAt(0);
  }

  let html = '';
  sorted.forEach(([nickname, items]) => {
    // Group files by type within anchor
    const video = items.filter(i => i.type === 'video');
    const audio = items.filter(i => i.type === 'audio');
    const text  = items.filter(i => i.type === 'text');
    const srt   = items.filter(i => i.type === 'srt');

    const color = getAvatarColor(nickname);
    const initials = getInitials(nickname);
    const dates = [...new Set(items.map(i => i.date))].sort().reverse();
    const types = [];
    if (video.length) types.push('🎬' + video.length);
    if (audio.length) types.push('🎵' + audio.length);
    if (text.length) types.push('📄' + text.length);
    if (srt.length) types.push('💬' + srt.length);

    html += `<div class="anchor-section">
      <div class="anchor-header">
        <div class="avatar" style="background:${color}20;color:${color}">${initials}</div>
        <div class="info">
          <div class="name">${nickname}</div>
          <div class="sub">${types.join(' · ')} · ${dates[0]}${dates.length > 1 ? ' ~ ' + dates[dates.length-1] : ''}</div>
        </div>
      </div>
      <div class="file-list">`;

    const ordered = [...video, ...audio, ...text, ...srt];
    ordered.forEach(item => {
      const dateStr = item.date.slice(0,4) + '-' + item.date.slice(4,6) + '-' + item.date.slice(6,8);
      html += `<div class="file-row icon-${item.type}">
        <div class="icon-badge">${getIcon(item.type)}</div>
        <div class="fmeta">
          <div class="fname">${item.name}</div>
          <div class="fsub">
            <span class="fsize">${fmtSize(item.size)}</span>
            <span>${dateStr}</span>
            <span class="release-tag">${item.release_tag}</span>
          </div>
        </div>
        <a class="dl" href="${item.url}" target="_blank" onclick="showToast('⚡ 开始下载')">下载</a>
      </div>`;
    });

    html += `</div></div>`;
  });

  content.innerHTML = html;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadData();
</script>
</body>
</html>
