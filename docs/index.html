<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>抖音录制文件浏览器</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap');



*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }



:root {

  --bg: #0a0a0f;

  --surface: #12121a;

  --surface2: #1a1a28;

  --surface3: #242440;

  --border: #2a2a45;

  --text: #e0e0f0;

  --text-dim: #8888aa;

  --accent: #ff4d6a;

  --accent2: #ffb347;

  --accent3: #6c5ce7;

  --accent4: #00d2ff;

  --green: #00e676;

  --radius: 12px;

  --shadow: 0 8px 32px rgba(0,0,0,0.5);

}



body {

  font-family: 'Noto Sans SC', -apple-system, sans-serif;

  background: var(--bg);

  color: var(--text);

  min-height: 100vh;

  display: flex;

  flex-direction: column;

}



/* Header */

.header {

  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);

  border-bottom: 1px solid var(--border);

  padding: 40px 24px 32px;

  position: relative;

  overflow: hidden;

}

.header::before {

  content: '';

  position: absolute;

  top: -50%;

  left: -50%;

  width: 200%;

  height: 200%;

  background: radial-gradient(circle at 20% 50%, rgba(108,92,231,0.08) 0%, transparent 50%),

              radial-gradient(circle at 80% 50%, rgba(255,77,106,0.06) 0%, transparent 50%);

  pointer-events: none;

}

.header-content { position: relative; max-width: 1200px; margin: 0 auto; }

.header h1 {

  font-size: 28px; font-weight: 900;

  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);

  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

}

.header p { color: var(--text-dim); font-size: 14px; margin-top: 6px; }

.stats-bar { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; }

.stat-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }

.stat-item .num { color: var(--text); font-weight: 700; font-size: 16px; }



/* Main */

.container { max-width: 1200px; margin: 0 auto; padding: 24px; width: 100%; flex: 1; }



/* Filters */

.filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }

.filters input, .filters select {

  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;

  padding: 10px 16px; color: var(--text); font-size: 14px; font-family: 'Noto Sans SC', sans-serif;

  outline: none; transition: border-color 0.2s;

}

.filters input:focus, .filters select:focus { border-color: var(--accent); }

.filters input::placeholder { color: var(--text-dim); }

.filters .search-wrap { position: relative; flex: 1; min-width: 200px; }

.filters .search-wrap input { width: 100%; padding-left: 40px; }

.filters .search-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; }



/* Date Groups */

.date-group { margin-bottom: 32px; }

.date-header {

  display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);

}

.date-header h2 { font-size: 16px; font-weight: 700; }

.date-header .count {

  background: var(--surface2); color: var(--text-dim); padding: 2px 10px; border-radius: 20px; font-size: 12px;

}



/* Asset Cards */

.assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

.asset-card {

  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);

  padding: 16px; transition: all 0.25s ease; position: relative;

}

.asset-card:hover {

  background: var(--surface2); border-color: var(--accent3);

  transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,92,231,0.15);

}

.asset-card .icon-area {

  width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center;

  font-size: 18px; margin-bottom: 10px;

}

.asset-card.icon-video .icon-area { background: rgba(255,77,106,0.15); }

.asset-card.icon-audio .icon-area { background: rgba(108,92,231,0.15); }

.asset-card.icon-text .icon-area { background: rgba(0,210,255,0.15); }

.asset-card.icon-srt .icon-area { background: rgba(0,230,118,0.15); }

.asset-card .name {

  font-size: 13px; font-weight: 500; line-height: 1.4;

  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all;

}

.asset-card .meta {

  display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--text-dim);

}

.asset-card .size { font-family: 'JetBrains Mono', monospace; font-size: 11px; }



/* Card actions */

.asset-card .card-actions {

  position: absolute; top: 12px; right: 12px;

  display: flex; gap: 4px;

}

.asset-card .card-actions button, .asset-card .card-actions a {

  width: 32px; height: 32px; border-radius: 8px; background: var(--surface3);

  border: none; color: var(--text-dim); cursor: pointer; display: flex;

  align-items: center; justify-content: center; font-size: 13px; text-decoration: none;

  opacity: 0; transition: all 0.2s;

}

.asset-card:hover .card-actions button, .asset-card:hover .card-actions a { opacity: 1; }

.asset-card .card-actions button:hover, .asset-card .card-actions a:hover {

  background: var(--accent3); color: #fff;

}

.asset-card .card-actions .dl-only:hover { background: var(--accent3) !important; }



/* Type badge */

.type-badge {

  display: inline-block; padding: 2px 8px; border-radius: 4px;

  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;

}

.badge-video { background: rgba(255,77,106,0.2); color: var(--accent); }

.badge-audio { background: rgba(108,92,231,0.2); color: var(--accent3); }

.badge-text  { background: rgba(0,210,255,0.2); color: var(--accent4); }

.badge-srt   { background: rgba(0,230,118,0.2); color: var(--green); }



.asset-card .anchor-name {

  font-size: 11px; color: var(--accent2); font-weight: 500; margin-bottom: 4px;

}



/* Loading */

.loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }

.loading .spinner {

  width: 40px; height: 40px; border: 3px solid var(--surface2); border-top-color: var(--accent);

  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;

}

@keyframes spin { to { transform: rotate(360deg); } }



/* Empty */

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }

.empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }

.footer { text-align: center; padding: 24px; color: var(--text-dim); font-size: 12px; border-top: 1px solid var(--border); }



/* Toast */

.toast {

  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);

  background: var(--green); color: #000; padding: 10px 20px; border-radius: 8px;

  font-size: 13px; font-weight: 500; z-index: 2000;

  opacity: 0; transition: opacity 0.3s; pointer-events: none;

}

.toast.show { opacity: 1; }



/* Preview Modal */

.modal-overlay {

  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);

  backdrop-filter: blur(12px); z-index: 3000; justify-content: center; align-items: center;

}

.modal-overlay.show { display: flex; }

.modal {

  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;

  width: 92%; max-width: 900px; max-height: 90vh; overflow: hidden;

  display: flex; flex-direction: column; box-shadow: 0 24px 80px rgba(0,0,0,0.7);

  animation: modalIn 0.25s ease;

}

@keyframes modalIn {

  from { opacity: 0; transform: scale(0.95) translateY(16px); }

  to { opacity: 1; transform: scale(1) translateY(0); }

}

.modal-top {

  display: flex; align-items: center; gap: 12px; padding: 16px 20px;

  border-bottom: 1px solid var(--border); flex-shrink: 0;

}

.modal-top .back {

  width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); border: none;

  color: var(--text-dim); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;

}

.modal-top .back:hover { background: var(--surface3); color: var(--text); }

.modal-top .mtitle { flex: 1; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.modal-top .close2 {

  width: 32px; height: 32px; border-radius: 8px; background: transparent; border: none;

  color: var(--text-dim); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;

}

.modal-top .close2:hover { color: var(--text); }

.modal-scroll { overflow-y: auto; flex: 1; padding: 20px; }



.video-player-wrap { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }

.video-player-wrap video { width: 100%; display: block; max-height: 60vh; }

.audio-player-wrap { padding: 20px; text-align: center; }

.audio-player-wrap .big-icon { font-size: 64px; margin-bottom: 16px; }

.audio-player-wrap audio { width: 100%; }

.text-viewer { padding: 0; white-space: pre-wrap; font-family: 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.8; color: var(--text); }

.text-viewer .line { padding: 2px 0; }

.text-viewer .line.timestamp { color: var(--accent4); font-size: 12px; }

.text-viewer .line.timestamp::before { content: '⏱ '; }

.text-viewer .line.sep { height: 4px; }

.srt-viewer { font-family: 'Noto Sans SC', sans-serif; }

.srt-viewer .cue { padding: 8px 12px; margin-bottom: 4px; border-radius: 6px; background: var(--surface2); border-left: 3px solid var(--green); }

.srt-viewer .cue .timecode { font-size: 11px; color: var(--green); font-family: 'JetBrains Mono', monospace; margin-bottom: 4px; }

.srt-viewer .cue .text { font-size: 14px; line-height: 1.6; }

.preview-loading { text-align: center; padding: 40px; color: var(--text-dim); }

.preview-loading .spinner { width: 32px; height: 32px; border: 3px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }

.preview-error { text-align: center; padding: 40px; color: var(--accent); }



@media (max-width: 640px) {

  .header { padding: 24px 16px 20px; }

  .container { padding: 16px; }

  .assets-grid { grid-template-columns: 1fr; }

  .filters { flex-direction: column; }

  .filters .search-wrap { min-width: 100%; }

  .modal { width: 100%; max-height: 100vh; border-radius: 0; }

}


/* Room Manager */
.tab-bar { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.tab-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 20px; color: var(--text-dim); font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.tab-btn:hover { background: var(--surface3); color: var(--text); }
.tab-btn.active { background: var(--accent3); border-color: var(--accent3); color: #fff; }

.room-mgr { display: none; }
.room-mgr.show { display: block; }

.room-mgr .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.room-mgr .toolbar input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; flex: 1; min-width: 140px; font-family: inherit; }
.room-mgr .toolbar input:focus { border-color: var(--accent); }
.room-mgr .toolbar button { background: var(--accent); border: none; border-radius: 8px; padding: 10px 20px; color: #fff; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600; transition: opacity 0.2s; }
.room-mgr .toolbar button:hover { opacity: 0.85; }
.room-mgr .toolbar button.secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }

.room-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.room-table th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border); color: var(--text-dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.room-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.room-table tr:hover td { background: var(--surface2); }
.room-table .rid { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent4); }
.room-table .rname { color: var(--text); }
.room-table .sort-btns { display: flex; gap: 4px; }
.room-table .sort-btns button { background: transparent; border: 1px solid var(--border); border-radius: 4px; width: 26px; height: 26px; cursor: pointer; color: var(--text-dim); font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.room-table .sort-btns button:hover { background: var(--surface3); color: var(--text); }
.room-table .sort-btns button:disabled { opacity: 0.2; cursor: default; }
.room-table .del-btn { background: transparent; border: 1px solid rgba(255,77,106,0.3); border-radius: 4px; width: 26px; height: 26px; cursor: pointer; color: var(--accent); font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.room-table .del-btn:hover { background: rgba(255,77,106,0.15); }

.room-mgr .save-bar { margin-top: 20px; display: flex; gap: 10px; align-items: center; }
.room-mgr .save-bar button { background: var(--green); border: none; border-radius: 8px; padding: 12px 28px; color: #000; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
.room-mgr .save-bar button:hover { opacity: 0.85; }
.room-mgr .save-bar button:disabled { opacity: 0.4; cursor: default; }
.room-mgr .save-bar .status { color: var(--text-dim); font-size: 13px; }
.room-mgr .save-bar .status.ok { color: var(--green); }
.room-mgr .save-bar .status.err { color: var(--accent); }

/* Add inline name edit */
.room-table .rname-input { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; color: var(--text); font-size: 13px; outline: none; width: 100%; min-width: 120px; font-family: inherit; }
.room-table .rname-input:focus { border-color: var(--accent); }

.card-actions .del-asset { background: var(--accent) !important; }
.card-actions .del-asset:hover { background: #ff3355 !important; }
.confirm-dialog { position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:4000; }
.confirm-box { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:360px;text-align:center; }
.confirm-box p { margin-bottom:16px;font-size:14px;line-height:1.6; }
.confirm-box .btn-row { display:flex;gap:8px;justify-content:center; }
.confirm-box button { padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600; }
.confirm-box .btn-yes { background:var(--accent);color:#fff; }
.confirm-box .btn-yes:hover { opacity:0.85; }
.confirm-box .btn-no { background:var(--surface2);color:var(--text-dim);border:1px solid var(--border); }
.confirm-box .btn-no:hover { background:var(--surface3); }
</style>

</head>

<body>



<div class="header">

  <div class="header-content">

    <h1>🎬 抖音录制文件浏览器</h1>

    <p>直播间录制 / 音频 / 转录文字 — 在线预览与下载</p>

    <div class="stats-bar">

      <div class="stat-item"><span class="num" id="stat-releases">-</span> Release</div>

  



      <div class="stat-item"><span class="num" id="stat-files">-</span> 文件</div>

      <div class="stat-item"><span class="num" id="stat-rooms">-</span> 主播</div>

      <div class="stat-item"><span class="num" id="stat-days">-</span> 天记录</div>

    </div>

  </div>

</div>



</div>

<!-- Tab Bar -->
<div class="tab-bar" style="max-width:1200px;margin:0 auto;padding:0 24px;">
  <button class="tab-btn active" onclick="switchTab('browse')" id="tabBrowse">📂 浏览文件</button>
  <button class="tab-btn" onclick="switchTab('rooms')" id="tabRooms">📋 管理房间</button>
</div>

<!-- Room Manager Panel -->
<div id="roomMgr" class="room-mgr" style="max-width:1200px;margin:0 auto;padding:0 24px;">
  <div class="toolbar">
    <input type="text" id="newRoomId" placeholder="房间 ID" style="flex:0 0 180px;">
    <input type="text" id="newRoomName" placeholder="主播昵称（可选）" style="flex:0 0 200px;">
    <button onclick="addRoomViaMgr()">➕ 添加</button>
    <button class="secondary" onclick="refreshRoomTable()">🔄 刷新</button>
    <span id="roomCount" style="color:var(--text-dim);font-size:13px;margin-left:auto;"></span>
  </div>
  <div style="overflow-x:auto;">
    <table class="room-table" id="roomTable">
      <thead><tr><th style="width:40px">#</th><th style="width:60px">排序</th><th>房间 ID</th><th>主播昵称</th><th style="width:40px">删除</th></tr></thead>
      <tbody id="roomTableBody"></tbody>
    </table>
  </div>
  <div class="save-bar">
    <button id="saveRoomsBtn" onclick="saveRooms()">💾 保存到 GitHub</button>
    <span id="saveStatus" class="status"></span>
  </div>
</div>

<div id="browsePanel"><div class="container">

  <div class="filters">

    <div class="search-wrap">

      <span class="icon">🔍</span>

      <input type="text" id="searchInput" placeholder="搜索主播名、文件名..." oninput="renderAssets()">

    </div>

    <select id="typeFilter" onchange="renderAssets()">

      <option value="all">全部类型</option>

      <option value="video">🎬 视频</option>

      <option value="audio">🎵 音频</option>

      <option value="text">📄 文字</option>

      <option value="srt">💬 SRT</option>

    </select>

    <select id="anchorFilter" onchange="renderAssets()">

      <option value="all">全部主播</option>

    </select>

    <select id="dateFilter" onchange="renderAssets()">

      <option value="all">全部日期</option>

    </select>

  </div>



  <div id="content">

    <div class="loading">

      <div class="spinner"></div>

      <p>加载中，正在查询 GitHub API...</p>

    </div>

  </div>

</div></div>



<div class="footer">douyin-recorder · <span id="update-time"></span></div>



<div class="toast" id="toast"></div>



<!-- Preview Modal -->

<div class="modal-overlay" id="previewModal">

  <div class="modal">

    <div class="modal-top">

      <button class="back" onclick="closePreview()">←</button>

      <div class="mtitle" id="previewTitle">预览</div>

      <button class="close2" onclick="closePreview()">✕</button>

    </div>

    <div class="modal-scroll" id="previewBody">

      <div class="preview-loading"><div class="spinner"></div><p>加载中...</p></div>

    </div>

  </div>

</div>



<script>

const REPO = 'tangwei880620-rgb/douyin-recorder';

const API = 'https://api.github.com';

let allAssets = [];

let allReleases = [];

let rooms = [];

let anchors = new Set();




// Global _utf8_decode for use by all functions
function _utf8_decode(s) {
  return decodeURIComponent(Array.prototype.map.call(s, function(c) {
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
}

function fmtSize(bytes) {

  if (!bytes) return '-';

  if (bytes < 1024) return bytes + ' B';

  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';

  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';

  return (bytes / 1073741824).toFixed(2) + ' GB';

}



function fmtDate(iso) {

  return new Date(iso).toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' });

}



function fmtDateTime(iso) {

  return new Date(iso).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });

}



function getType(filename) {

  var f = filename.toLowerCase();

  if (f.endsWith('.mp4') || f.endsWith('.flv') || f.endsWith('.webm') || f.endsWith('.mkv')) return 'video';

  if (f.endsWith('.wav') || f.endsWith('.mp3') || f.endsWith('.aac') || f.endsWith('.ogg')) return 'audio';

  if (f.endsWith('.srt')) return 'srt';

  return 'text';

}



function getTypeBadge(type) {

  var m = { video:'badge-video', audio:'badge-audio', text:'badge-text', srt:'badge-srt' };

  var l = { video:'🎬 视频', audio:'🎵 音频', text:'📄 TXT', srt:'💬 SRT' };

  return '<span class="type-badge ' + (m[type]||'badge-text') + '">' + (l[type]||'📄') + '</span>';

}



function getIcon(type) {

  return { video:'🎬', audio:'🎵', text:'📄', srt:'💬' }[type] || '📄';

}



function toRawUrl(bwUrl) {
  if (bwUrl && (bwUrl.endsWith('.txt') || bwUrl.endsWith('.srt'))) {
    try {
      var parts = bwUrl.replace('https://github.com/', '').split('/download/');
      if (parts.length === 2) {
        return 'https://raw.githubusercontent.com/' + parts[0] + '/' + parts[1];
      }
    } catch(e) {}
  }
  return bwUrl;
}



function getDateKey(iso) {

  return new Date(iso).toISOString().slice(0, 10);

}




// Parse release body to build name map: safe_filename -> anchor_name
window.nameMap = {};
function buildNameMap(releases) {
  for (var ri = 0; ri < releases.length; ri++) {
    var body = releases[ri].body || '';
    // Lookup: anchor_name/basename (stored by upload_now)
    var lines = body.split('\n');
    for (var li = 1; li < lines.length; li++) {  // skip "auto upload"
      var line = lines[li].trim();
      if (!line) continue;
      var slashIdx = line.indexOf('/');
      if (slashIdx > 0 && slashIdx < line.length - 1) {
        var anchorName = line.substring(0, slashIdx);
        var safeName = line.substring(slashIdx + 1);
        window.nameMap[safeName] = anchorName;
      }
    }
  }
}

// Enhanced extractNickname: first try release body nameMap, then roomMap
function extractNickname(name) {
  // Try release body nameMap first
  if (window.nameMap && window.nameMap[name]) {
    return window.nameMap[name];
  }
  // Try room ID from filename prefix (new format: roomId_quality_ts.mp4)
  var m = name.match(/^([0-9]+)_/);
  var roomId = m ? m[1] : null;
  if (roomId && window.roomMap) {
    for (var i = 0; i < window.roomMap.length; i++) {
      if (window.roomMap[i].id === roomId) {
        var n = window.roomMap[i].name;
        if (/^[0-9]+$/.test(n)) return roomId; // use room id as fallback
        return n;
      }
    }
    return roomId; // not in roomMap, use room id
  }
  return name.split('_')[0]; // use first segment of filename
}

function openPreview(bwLink, name, type) {
  var modal = document.getElementById('previewModal');
  var body = document.getElementById('previewBody');
  document.getElementById('previewTitle').textContent = name;
  body.innerHTML = '<div class="preview-loading"><div class="spinner"></div><p>\u52a0\u8f7d\u4e2d...</p></div>';
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
  if (type==='video') {
    body.innerHTML = '<div style="padding:0;"><div class="video-player-wrap"><video controls preload="metadata" playsinline onerror="this.innerHTML=\'<div class=preview-error>\u89c6\u9891\u65e0\u6cd5\u64ad\u653e\uff0c\u8bf7\u70b9\u51fb\u4e0b\u8f7d\u6309\u94ae</div>\'"><source src="' + escAttr(bwLink) + '" type="video/mp4"></video></div></div>';
  } else if (type==='audio') {
    body.innerHTML = '<div class="audio-player-wrap"><div class="big-icon">\ud83c\udfb5</div><audio controls preload="metadata" style="width:100%" onerror="this.innerHTML=\'<div class=preview-error>\u97f3\u9891\u65e0\u6cd5\u64ad\u653e\uff0c\u8bf7\u70b9\u51fb\u4e0b\u8f7d\u6309\u94ae</div>\'"><source src="' + escAttr(bwLink) + '" type="audio/wav"></audio></div>';
  } else if (type==='text') {
    // Use raw.githubusercontent.com for text/SRT (GitHub Release redirects break CORS)
    // Extract release tag from bwLink: https://github.com/REPO/releases/download/TAG/NAME
    var tag = bwLink.split('/download/')[1].split('/')[0];
    var rawUrl = 'https://raw.githubusercontent.com/' + REPO + '/' + tag + '/' + encodeURIComponent(name);
    fetch(rawUrl, { mode: 'cors' }).then(function(r) {
      if (!r.ok) {
        // Fallback: try the browser_download_url directly (for old files)
        return fetch(bwLink).then(function(r2) { return r2.text(); });
      }
      return r.text();
    }).then(function(txt) {
      var h = '<div class="text-viewer">';
      txt.split('\n').forEach(function(line) {
        var t = line.trim();
        if (!t) { h+= '<div class="line sep"></div>'; return; }
        h+= '<div class="line' + (/^\[\d{2}:\d{2}:\d{2}/.test(t) ? ' timestamp' : '') + '">' + escHtml(line) + '</div>';
      });
      body.innerHTML = h + '</div>';
    }).catch(function(e) { body.innerHTML = '<div class="preview-error">\u274c ' + e.message + '<br><span style=font-size:13px>\u8bf7\u70b9\u51fb\u4e0b\u8f7d\u76f4\u63a5\u67e5\u770b</span></div>'; });
  } else if (type==='srt') {
    var tag2 = bwLink.split('/download/')[1].split('/')[0];
    var rawUrl2 = 'https://raw.githubusercontent.com/' + REPO + '/' + tag2 + '/' + encodeURIComponent(name);
    fetch(rawUrl2, { mode: 'cors' }).then(function(r) {
      if (!r.ok) {
        return fetch(bwLink).then(function(r2) { return r2.text(); });
      }
      return r.text();
    }).then(function(txt) {
      var h = '<div class="srt-viewer">';
      txt.split('\n\n').forEach(function(cue) {
        var lines = cue.split('\n').filter(function(l){return l.trim();});
        if (lines.length < 3) return;
        h+= '<div class="cue"><div class="timecode">' + escHtml(lines[1]) + '</div><div class="text">' + escHtml(lines.slice(2).join('\n')) + '</div></div>';
      });
      body.innerHTML = h + '</div>';
    }).catch(function(e) { body.innerHTML = '<div class="preview-error">\u274c ' + e.message + '</div>'; });
  }

          window.roomMap.forEach(function(r2) { window.roomLookup[r2.id] = r2.name; });
        } else {
          status.textContent = '\u274c \u4fdd\u5b58\u5931\u8d25: ' + (d && d.message || '\u672a\u77e5\u9519\u8bef');
          status.className = 'status err';
          btn.disabled = false;
        }
      }).catch(function(e){
        status.textContent = '\u274c \u7f51\u7edc\u9519\u8bef: ' + e.message;
        status.className = 'status err';
        btn.disabled = false;
      });
    })
    .catch(function(e){
      status.textContent = '\u274c \u83b7\u53d6\u5931\u8d25: ' + e.message;
      status.className = 'status err';
      btn.disabled = false;
    });
}
</script>
</html>
