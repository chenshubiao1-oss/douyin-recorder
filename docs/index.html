<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>抖音录制文件浏览器</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap');



*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }



:root {

  --bg: #0a0a0f;

  --surface: #12121a;

  --surface2: #1a1a28;

  --surface3: #242440;

  --border: #2a2a45;

  --text: #e0e0f0;

  --text-dim: #8888aa;

  --accent: #ff4d6a;

  --accent2: #ffb347;

  --accent3: #6c5ce7;

  --accent4: #00d2ff;

  --green: #00e676;

  --radius: 12px;

  --shadow: 0 8px 32px rgba(0,0,0,0.5);

}



body {

  font-family: 'Noto Sans SC', -apple-system, sans-serif;

  background: var(--bg);

  color: var(--text);

  min-height: 100vh;

  display: flex;

  flex-direction: column;

}



/* Header */

.header {

  background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);

  border-bottom: 1px solid var(--border);

  padding: 40px 24px 32px;

  position: relative;

  overflow: hidden;

}

.header::before {

  content: '';

  position: absolute;

  top: -50%;

  left: -50%;

  width: 200%;

  height: 200%;

  background: radial-gradient(circle at 20% 50%, rgba(108,92,231,0.08) 0%, transparent 50%),

              radial-gradient(circle at 80% 50%, rgba(255,77,106,0.06) 0%, transparent 50%);

  pointer-events: none;

}

.header-content { position: relative; max-width: 1200px; margin: 0 auto; }

.header h1 {

  font-size: 28px; font-weight: 900;

  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);

  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;

}

.header p { color: var(--text-dim); font-size: 14px; margin-top: 6px; }

.stats-bar { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; }

.stat-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); }

.stat-item .num { color: var(--text); font-weight: 700; font-size: 16px; }



/* Main */

.container { max-width: 1200px; margin: 0 auto; padding: 24px; width: 100%; flex: 1; }



/* Filters */

.filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }

.filters input, .filters select {

  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;

  padding: 10px 16px; color: var(--text); font-size: 14px; font-family: 'Noto Sans SC', sans-serif;

  outline: none; transition: border-color 0.2s;

}

.filters input:focus, .filters select:focus { border-color: var(--accent); }

.filters input::placeholder { color: var(--text-dim); }

.filters .search-wrap { position: relative; flex: 1; min-width: 200px; }

.filters .search-wrap input { width: 100%; padding-left: 40px; }

.filters .search-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 16px; }



/* Date Groups */

.date-group { margin-bottom: 32px; }

.date-header {

  display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);

}

.date-header h2 { font-size: 16px; font-weight: 700; }

.date-header .count {

  background: var(--surface2); color: var(--text-dim); padding: 2px 10px; border-radius: 20px; font-size: 12px;

}



/* Asset Cards */

.assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

.asset-card {

  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);

  padding: 16px; transition: all 0.25s ease; position: relative;

}

.asset-card:hover {

  background: var(--surface2); border-color: var(--accent3);

  transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,92,231,0.15);

}

.asset-card .icon-area {

  width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center;

  font-size: 18px; margin-bottom: 10px;

}

.asset-card.icon-video .icon-area { background: rgba(255,77,106,0.15); }

.asset-card.icon-audio .icon-area { background: rgba(108,92,231,0.15); }

.asset-card.icon-text .icon-area { background: rgba(0,210,255,0.15); }

.asset-card.icon-srt .icon-area { background: rgba(0,230,118,0.15); }

.asset-card .name {

  font-size: 13px; font-weight: 500; line-height: 1.4;

  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all;

}

.asset-card .meta {

  display: flex; align-items: center; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--text-dim);

}

.asset-card .size { font-family: 'JetBrains Mono', monospace; font-size: 11px; }



/* Card actions */

.asset-card .card-actions {

  position: absolute; top: 12px; right: 12px;

  display: flex; gap: 4px;

}

.asset-card .card-actions button, .asset-card .card-actions a {

  width: 32px; height: 32px; border-radius: 8px; background: var(--surface3);

  border: none; color: var(--text-dim); cursor: pointer; display: flex;

  align-items: center; justify-content: center; font-size: 13px; text-decoration: none;

  opacity: 0; transition: all 0.2s;

}

.asset-card:hover .card-actions button, .asset-card:hover .card-actions a { opacity: 1; }

.asset-card .card-actions button:hover, .asset-card .card-actions a:hover {

  background: var(--accent3); color: #fff;

}

.asset-card .card-actions .dl-only:hover { background: var(--accent3) !important; }



/* Type badge */

.type-badge {

  display: inline-block; padding: 2px 8px; border-radius: 4px;

  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;

}

.badge-video { background: rgba(255,77,106,0.2); color: var(--accent); }

.badge-audio { background: rgba(108,92,231,0.2); color: var(--accent3); }

.badge-text  { background: rgba(0,210,255,0.2); color: var(--accent4); }

.badge-srt   { background: rgba(0,230,118,0.2); color: var(--green); }



.asset-card .anchor-name {

  font-size: 11px; color: var(--accent2); font-weight: 500; margin-bottom: 4px;

}



/* Loading */

.loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }

.loading .spinner {

  width: 40px; height: 40px; border: 3px solid var(--surface2); border-top-color: var(--accent);

  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;

}

@keyframes spin { to { transform: rotate(360deg); } }



/* Empty */

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }

.empty-state .big-icon { font-size: 48px; margin-bottom: 12px; }

.footer { text-align: center; padding: 24px; color: var(--text-dim); font-size: 12px; border-top: 1px solid var(--border); }



/* Toast */

.toast {

  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);

  background: var(--green); color: #000; padding: 10px 20px; border-radius: 8px;

  font-size: 13px; font-weight: 500; z-index: 2000;

  opacity: 0; transition: opacity 0.3s; pointer-events: none;

}

.toast.show { opacity: 1; }



/* Preview Modal */

.modal-overlay {

  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);

  backdrop-filter: blur(12px); z-index: 3000; justify-content: center; align-items: center;

}

.modal-overlay.show { display: flex; }

.modal {

  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;

  width: 92%; max-width: 900px; max-height: 90vh; overflow: hidden;

  display: flex; flex-direction: column; box-shadow: 0 24px 80px rgba(0,0,0,0.7);

  animation: modalIn 0.25s ease;

}

@keyframes modalIn {

  from { opacity: 0; transform: scale(0.95) translateY(16px); }

  to { opacity: 1; transform: scale(1) translateY(0); }

}

.modal-top {

  display: flex; align-items: center; gap: 12px; padding: 16px 20px;

  border-bottom: 1px solid var(--border); flex-shrink: 0;

}

.modal-top .back {

  width: 32px; height: 32px; border-radius: 8px; background: var(--surface2); border: none;

  color: var(--text-dim); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;

}

.modal-top .back:hover { background: var(--surface3); color: var(--text); }

.modal-top .mtitle { flex: 1; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.modal-top .close2 {

  width: 32px; height: 32px; border-radius: 8px; background: transparent; border: none;

  color: var(--text-dim); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;

}

.modal-top .close2:hover { color: var(--text); }

.modal-scroll { overflow-y: auto; flex: 1; padding: 20px; }



.video-player-wrap { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }

.video-player-wrap video { width: 100%; display: block; max-height: 60vh; }

.audio-player-wrap { padding: 20px; text-align: center; }

.audio-player-wrap .big-icon { font-size: 64px; margin-bottom: 16px; }

.audio-player-wrap audio { width: 100%; }

.text-viewer { padding: 0; white-space: pre-wrap; font-family: 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.8; color: var(--text); }

.text-viewer .line { padding: 2px 0; }

.text-viewer .line.timestamp { color: var(--accent4); font-size: 12px; }

.text-viewer .line.timestamp::before { content: '⏱ '; }

.text-viewer .line.sep { height: 4px; }

.srt-viewer { font-family: 'Noto Sans SC', sans-serif; }

.srt-viewer .cue { padding: 8px 12px; margin-bottom: 4px; border-radius: 6px; background: var(--surface2); border-left: 3px solid var(--green); }

.srt-viewer .cue .timecode { font-size: 11px; color: var(--green); font-family: 'JetBrains Mono', monospace; margin-bottom: 4px; }

.srt-viewer .cue .text { font-size: 14px; line-height: 1.6; }

.preview-loading { text-align: center; padding: 40px; color: var(--text-dim); }

.preview-loading .spinner { width: 32px; height: 32px; border: 3px solid var(--surface2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }

.preview-error { text-align: center; padding: 40px; color: var(--accent); }



@media (max-width: 640px) {

  .header { padding: 24px 16px 20px; }

  .container { padding: 16px; }

  .assets-grid { grid-template-columns: 1fr; }

  .filters { flex-direction: column; }

  .filters .search-wrap { min-width: 100%; }

  .modal { width: 100%; max-height: 100vh; border-radius: 0; }

}

</style>

</head>

<body>



<div class="header">

  <div class="header-content">

    <h1>🎬 抖音录制文件浏览器</h1>

    <p>直播间录制 / 音频 / 转录文字 — 在线预览与下载</p>

    <div class="stats-bar">

      <div class="stat-item"><span class="num" id="stat-releases">-</span> Release</div>

      <div class="stat-item"><span class="num" id="stat-files">-</span> 文件</div>

      <div class="stat-item"><span class="num" id="stat-rooms">-</span> 主播</div>

      <div class="stat-item"><span class="num" id="stat-days">-</span> 天记录</div>

    </div>

  </div>

</div>



<div class="container">

  <div class="filters">

    <div class="search-wrap">

      <span class="icon">🔍</span>

      <input type="text" id="searchInput" placeholder="搜索主播名、文件名..." oninput="renderAssets()">

    </div>

    <select id="typeFilter" onchange="renderAssets()">

      <option value="all">全部类型</option>

      <option value="video">🎬 视频</option>

      <option value="audio">🎵 音频</option>

      <option value="text">📄 文字</option>

      <option value="srt">💬 SRT</option>

    </select>

    <select id="anchorFilter" onchange="renderAssets()">

      <option value="all">全部主播</option>

    </select>

    <select id="dateFilter" onchange="renderAssets()">

      <option value="all">全部日期</option>

    </select>

  </div>



  <div id="content">

    <div class="loading">

      <div class="spinner"></div>

      <p>加载中，正在查询 GitHub API...</p>

    </div>

  </div>

</div>



<div class="footer">douyin-recorder · <span id="update-time"></span></div>



<div class="toast" id="toast"></div>



<!-- Preview Modal -->

<div class="modal-overlay" id="previewModal">

  <div class="modal">

    <div class="modal-top">

      <button class="back" onclick="closePreview()">←</button>

      <div class="mtitle" id="previewTitle">预览</div>

      <button class="close2" onclick="closePreview()">✕</button>

    </div>

    <div class="modal-scroll" id="previewBody">

      <div class="preview-loading"><div class="spinner"></div><p>加载中...</p></div>

    </div>

  </div>

</div>



<script>

const REPO = 'tangwei880620-rgb/douyin-recorder';

const API = 'https://api.github.com';

let allAssets = [];

let allReleases = [];

let rooms = [];

let anchors = new Set();



function fmtSize(bytes) {

  if (!bytes) return '-';

  if (bytes < 1024) return bytes + ' B';

  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';

  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';

  return (bytes / 1073741824).toFixed(2) + ' GB';

}



function fmtDate(iso) {

  return new Date(iso).toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' });

}



function fmtDateTime(iso) {

  return new Date(iso).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });

}



function getType(filename) {

  var f = filename.toLowerCase();

  if (f.endsWith('.mp4') || f.endsWith('.flv') || f.endsWith('.webm') || f.endsWith('.mkv')) return 'video';

  if (f.endsWith('.wav') || f.endsWith('.mp3') || f.endsWith('.aac') || f.endsWith('.ogg')) return 'audio';

  if (f.endsWith('.srt')) return 'srt';

  return 'text';

}



function getTypeBadge(type) {

  var m = { video:'badge-video', audio:'badge-audio', text:'badge-text', srt:'badge-srt' };

  var l = { video:'🎬 视频', audio:'🎵 音频', text:'📄 TXT', srt:'💬 SRT' };

  return '<span class="type-badge ' + (m[type]||'badge-text') + '">' + (l[type]||'📄') + '</span>';

}



function getIcon(type) {

  return { video:'🎬', audio:'🎵', text:'📄', srt:'💬' }[type] || '📄';

}



function extractNickname(name) {
  // Extract room_id from filename (leading digits before _FULL_HD or _HD)
  var m = name.match(/^([0-9]+)_/);
  var roomId = m ? m[1] : null;
  
  // Look up in roomMap
  if (roomId && window.roomMap) {
    for (var i = 0; i < window.roomMap.length; i++) {
      if (window.roomMap[i].id === roomId || window.roomMap[i].id === roomId.replace(/^0+/, '')) {
        var n = window.roomMap[i].name;
        // If name is just a number (unmapped room), return "未分类"
        if (/^[0-9]+$/.test(n)) return '未分类';
        return n;
      }
    }
  }
  
  // Try matching from roomMap by substring (for names that start with roomId)
  if (roomId && window.roomMap) {
    for (var i = 0; i < window.roomMap.length; i++) {
      var rn = window.roomMap[i].name;
      if (rn && !/^[0-9]+$/.test(rn)) return rn;
    }
  }
  
  return '未分类';
}

function toRawUrl(bwUrl) {
  // For video/audio preview, we need a URL that browsers can play.
  // GitHub release download URLs redirect, which most browsers handle fine.
  // If issues persist, we can switch to jsdelivr CDN proxy.
  return bwUrl;
}function toRawUrl(x) { return x; }



function getDateKey(iso) {

  return new Date(iso).toISOString().slice(0, 10);

}



async function loadData() {

  try {

    var roomsResp = await fetch(API + '/repos/' + REPO + '/contents/rooms.txt');

    var roomsData = await roomsResp.json();

    function _utf8_decode(s) {
  return decodeURIComponent(Array.prototype.map.call(s, function(c) {
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
}
    var roomsText = _utf8_decode(atob(roomsData.content.replace(/\n/g, "")));

    window.roomMap = []; rooms = roomsText.split('\n').filter(function(l) { return l.trim() && !l.startsWith('#'); }).map(function(l) {

      var parts = l.split('=');

      var r = { id: parts[0].trim(), name: parts[1] ? parts[1].trim() : parts[0].trim() };

      window.roomMap.push(r);

      return r;

    });



    var page = 1, all = [];

    while (true) {

      var resp = await fetch(API + '/repos/' + REPO + '/releases?per_page=100&page=' + page);

      if (!resp.ok) break;

      var data = await resp.json();

      if (data.length === 0) break;

      all = all.concat(data);

      page++;

    }

    allReleases = all.filter(function(r) { return r.assets && r.assets.length > 0; });



    allAssets = [];

    for (var ri = 0; ri < allReleases.length; ri++) {

      var rel = allReleases[ri];

      for (var ai = 0; ai < rel.assets.length; ai++) {

        var asset = rel.assets[ai];

        var type = getType(asset.name);

        var anchor = extractNickname(asset.name);

        anchors.add(anchor);

        allAssets.push({

          id: asset.id, name: asset.name, size: asset.size,

          browser_download_url: asset.browser_download_url,

          rawUrl: toRawUrl(asset.browser_download_url),

          created_at: asset.created_at || rel.created_at,

          type: type, anchor: anchor,

          release_tag: rel.tag_name, release_name: rel.name || rel.tag_name, release_url: rel.html_url,

        });

      }

    }



    allAssets.sort(function(a,b){ return new Date(b.created_at)-new Date(a.created_at); });

    populateFilters();

    renderAssets();

  } catch (e) {

    document.getElementById('content').innerHTML = '<div class="empty-state"><div class="big-icon">❌</div><p>加载失败: ' + e.message + '</p></div>';

  }

}



function populateFilters() {

  var selA = document.getElementById('anchorFilter');

  Array.from(anchors).sort().forEach(function(a) { if(!a)return; var o=document.createElement('option'); o.value=a; o.textContent=a; selA.appendChild(o); });

  var dateSet = {};

  allAssets.forEach(function(a) { dateSet[fmtDate(a.created_at)]=true; });

  var selD = document.getElementById('dateFilter');

  Object.keys(dateSet).sort().reverse().forEach(function(d) { var o=document.createElement('option'); o.value=d; o.textContent=d; selD.appendChild(o); });

  document.getElementById('stat-releases').textContent = allReleases.length;

  document.getElementById('stat-files').textContent = allAssets.length;

  document.getElementById('stat-rooms').textContent = anchors.size;

  var days = {};

  allAssets.forEach(function(a) { days[getDateKey(a.created_at)]=true; });

  document.getElementById('stat-days').textContent = Object.keys(days).length + ' 天';

  document.getElementById('update-time').textContent = '上次更新: ' + new Date().toLocaleString('zh-CN');

}



function renderAssets() {

  var search = document.getElementById('searchInput').value.toLowerCase();

  var typeFilter = document.getElementById('typeFilter').value;

  var anchorFilter = document.getElementById('anchorFilter').value;

  var dateFilter = document.getElementById('dateFilter').value;



  var filtered = allAssets.filter(function(a) {

    if (typeFilter!=='all' && a.type!==typeFilter) return false;

    if (anchorFilter!=='all' && a.anchor!==anchorFilter) return false;

    if (dateFilter!=='all' && fmtDate(a.created_at)!==dateFilter) return false;

    if (search && a.name.toLowerCase().indexOf(search)===-1 && a.anchor.toLowerCase().indexOf(search)===-1) return false;

    return true;

  });



  var groups = {};

  filtered.forEach(function(a) {

    if (!groups[a.release_tag]) groups[a.release_tag] = { tag:a.release_tag, name:a.release_name, url:a.release_url, created_at:a.created_at, items:[] };

    groups[a.release_tag].items.push(a);

  });

  var sortedGroups = Object.values(groups).sort(function(a,b){ return new Date(b.created_at)-new Date(a.created_at); });



  var el = document.getElementById('content');

  if (sortedGroups.length===0) { el.innerHTML = '<div class="empty-state"><div class="big-icon">📭</div><p>没有找到匹配的文件</p></div>'; return; }



  var html = '';

  sortedGroups.forEach(function(g) {

    g.items.sort(function(a,b) {

      if (a.anchor!==b.anchor) return a.anchor.localeCompare(b.anchor);

      var o={video:0,audio:1,text:2,srt:3};

      return (o[a.type]||99)-(o[b.type]||99);

    });

    html += '<div class="date-group"><div class="date-header"><h2>🏷 ' + escHtml(g.tag) + '</h2><span class="count">' + g.items.length + ' 个文件</span><span style="font-size:12px;color:var(--text-dim)">' + fmtDateTime(g.created_at) + '</span><a href="' + escAttr(g.url) + '" target="_blank" style="font-size:12px;color:var(--accent4);margin-left:auto;text-decoration:none;">查看 Release →</a></div><div class="assets-grid">';



    g.items.forEach(function(item) {

      var canPrev = item.type==='video' || item.type==='audio' || item.type==='text' || item.type==='srt';

      html += '<div class="asset-card icon-' + item.type + '">' +

        '<div class="icon-area">' + getIcon(item.type) + '</div>' +

        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">' +

          '<span class="type-badge badge-' + item.type + '">' + item.type.toUpperCase() + '</span>' +

          '<span style="font-size:11px;color:var(--text-dim);font-family:\'JetBrains Mono\',monospace;">' + fmtSize(item.size) + '</span>' +

        '</div>' +

        '<div class="anchor-name">' + escHtml(item.anchor) + '</div>' +

        '<div class="name">' + escHtml(item.name) + '</div>' +

        '<div class="meta"><span>' + fmtDateTime(item.created_at) + '</span></div>' +

        '<div class="card-actions">' +

          (canPrev ? '<button onclick="event.stopPropagation();openPreview(\'' + escAttr(item.rawUrl) + '\',\'' + escAttr(item.name) + '\',\'' + item.type + '\')" title="预览">👁</button>' : '') +

          '<a href="' + escAttr(item.browser_download_url) + '" target="_blank" onclick="event.stopPropagation();showToast(\'⚡ 下载中\')" class="dl-only" title="下载">⬇</a>' +

        '</div>' +

      '</div>';

    });

    html += '</div></div>';

  });

  el.innerHTML = html;

}



// Preview

function openPreview(bwLink, name, type) {

  var modal = document.getElementById('previewModal');

  var body = document.getElementById('previewBody');

  document.getElementById('previewTitle').textContent = name;

  body.innerHTML = '<div class="preview-loading"><div class="spinner"></div><p>加载中...</p></div>';

  modal.classList.add('show');

  document.body.style.overflow = 'hidden';



  if (type==='video') {

    body.innerHTML = '<div style="padding:0;"><div class="video-player-wrap"><video controls autoplay preload="auto" playsinline onerror="this.parentElement.innerHTML=\'<div class=preview-error>❌ 视频加载失败</div>\'"><source src="' + escAttr(bwLink) + '" type="video/mp4></video></div></div>';

  } else if (type==='audio') {

    body.innerHTML = '<div class="audio-player-wrap"><div class="big-icon">🎵</div><audio controls autoplay preload="auto" style="width:100%" onerror="this.parentElement.innerHTML=\'<div class=preview-error>❌ 音频加载失败</div>\'"><source src="' + escAttr(bwLink) + '" type="audio/wav></audio></div>';

  } else if (type==='text') {

    fetch(bwLink).then(function(r) { if(!r.ok)throw new Error('HTTP '+r.status); return r.text(); }).then(function(txt) {

      var h = '<div class="text-viewer">';

      txt.split('\n').forEach(function(line) {

        var t = line.trim();

        if (!t) { h+= '<div class="line sep"></div>'; return; }

        h+= '<div class="line' + (/^\[\d{2}:\d{2}:\d{2}/.test(t) ? ' timestamp' : '') + '">' + escHtml(line) + '</div>';

      });

      body.innerHTML = h + '</div>';

    }).catch(function(e) { body.innerHTML = '<div class="preview-error">❌ ' + e.message + '</div>'; });

  } else if (type==='srt') {

    fetch(bwLink).then(function(r) { if(!r.ok)throw new Error('HTTP '+r.status); return r.text(); }).then(function(txt) {

      var h = '<div class="srt-viewer">';

      txt.split('\n\n').forEach(function(cue) {

        var lines = cue.split('\n').filter(function(l){return l.trim();});

        if (lines.length<3) return;

        h+= '<div class="cue"><div class="timecode">' + escHtml(lines[1]) + '</div><div class="text">' + escHtml(lines.slice(2).join('\n')) + '</div></div>';

      });

      body.innerHTML = h + '</div>';

    }).catch(function(e) { body.innerHTML = '<div class="preview-error">❌ ' + e.message + '</div>'; });

  }

}



function closePreview() {

  var body = document.getElementById('previewBody');

  body.querySelectorAll('video').forEach(function(v){v.pause();v.src='';});

  body.querySelectorAll('audio').forEach(function(a){a.pause();a.src='';});

  body.innerHTML = '';

  document.getElementById('previewModal').classList.remove('show');

  document.body.style.overflow = '';

}

document.getElementById('previewModal').addEventListener('click', function(e) { if(e.target===this) closePreview(); });

document.addEventListener('keydown', function(e) { if(e.key==='Escape') closePreview(); });



function showToast(msg) {

  var t = document.getElementById('toast');

  t.textContent = msg; t.classList.add('show');

  setTimeout(function(){t.classList.remove('show');},2000);

}



function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }



loadData();

</script>
