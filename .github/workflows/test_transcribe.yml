name: 测试转写

on:
  workflow_dispatch:
    inputs:
      room_id:
        description: '抖音直播间ID'
        required: true
        default: '344763580'

jobs:
  test_transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install playwright funasr
          python -m playwright install chromium --with-deps
          mkdir -p /tmp/recordings /tmp/transcripts

      - name: 录制60秒
        run: python -u -c "
import os, sys, json, time, subprocess
sys.path.insert(0, '.')
from recorder import navigate_page, is_live_page, get_stream_url, log, start_recording, stop_proc
from playwright.sync_api import sync_playwright

room_id = '${{ github.event.inputs.room_id }}'
os.environ['GH_REPO'] = '${{ github.repository }}'
os.environ['GH_TOKEN'] = '${{ secrets.GITHUB_TOKEN }}'

with sync_playwright() as p:
    browser = p.chromium.launch(headless=True, args=['--no-sandbox','--disable-gpu'])
    context = browser.new_context(user_agent='Mozilla/5.0', viewport={'width':1280,'height':720})
    page = context.new_page()
    navigate_page(page, room_id)
    time.sleep(5)
    
    is_live = is_live_page(page)
    log(f'直播间直播状态: {\"ONAIR\" if is_live else \"OFF\"}')
    
    if is_live:
        # 获取流地址
        page.reload(wait_until='domcontentloaded', timeout=30000)
        time.sleep(5)
        for attempt in range(8):
            quality, url = get_stream_url(page, room_id)
            if url: break
            log(f'等待推流地址... ({attempt+1}/8)'); time.sleep(3)
        
        if url:
            proc, outfile, audio_proc, audiofile = start_recording(url, quality, room_id, 'test')
            log(f'开始录制60秒...')
            time.sleep(60)
            
            # 停止
            stop_proc(proc)
            stop_proc(audio_proc)
            
            vsize = os.path.getsize(outfile) if os.path.exists(outfile) else 0
            asize = os.path.getsize(audiofile) if os.path.exists(audiofile) else 0
            log(f'录制完成: 视频 {vsize/1024/1024:.1f}MB, 音频 {asize/1024/1024:.1f}MB')
            
            # 上传视频和音频
            import subprocess as sp
            for f in [outfile, audiofile]:
                if os.path.exists(f):
                    sp.run(['gh','api','-X','POST',f'/repos/${{ github.repository }}/actions/artifacts',
                           '-f',f'name=test-recordings','-f',f'path={f}'],
                          capture_output=True, timeout=60,
                          env={**os.environ, 'GITHUB_TOKEN': os.environ.get('GH_TOKEN','')})
                    log(f'上传: {os.path.basename(f)}')
            
            # 设置环境变量给下一步
            with open('/tmp/audio_path.txt', 'w') as f:
                f.write(audiofile)
        else:
            log('获取推流地址失败')
            open('/tmp/audio_path.txt', 'w').write('')
    else:
        log('当前不在直播，跳过录制')
        open('/tmp/audio_path.txt', 'w').write('')
    
    browser.close()
"

      - name: 执行转写
        run: |
          AUDIO_PATH=$(cat /tmp/audio_path.txt)
          if [ -z "$AUDIO_PATH" ] || [ ! -f "$AUDIO_PATH" ]; then
            echo "没有音频文件，跳过转写"
            exit 0
          fi
          echo "音频文件: $AUDIO_PATH ($(du -h "$AUDIO_PATH" | cut -f1))"
          python -u -c "
import sys, os, json
sys.path.insert(0, '.')
from transcriber import transcribe, log
os.environ['GH_REPO'] = '${{ github.repository }}'
os.environ['GH_TOKEN'] = '${{ secrets.GITHUB_TOKEN }}'

audio_path = '${{ steps.*.outputs.audio_path }}'
# read from file
with open('/tmp/audio_path.txt') as f:
    audio_path = f.read().strip()

if not audio_path or not os.path.exists(audio_path):
    log('无音频文件')
    exit(0)

log(f'开始转写: {os.path.basename(audio_path)}')
try:
    txt, srt = transcribe(audio_path)
    log(f'转写结果:')
    with open(txt, 'r', encoding='utf-8') as f:
        print(f.read())
except Exception as e:
    log(f'转写出错: {e}')
    import traceback; traceback.print_exc()
"

      - name: 上传转写结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-transcribe-result
          path: /tmp/transcripts/
          retention-days: 30
          if-no-files-found: ignore
