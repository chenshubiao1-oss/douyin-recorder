name: 音频转写

on:
  workflow_dispatch:
  schedule:
    # 每天转写一次，检查前一天的录制
    - cron: '30 3 * * *'  # 每天 UTC 03:30 (泰时 10:30)

env:
  PYTHON_VERSION: '3.11'

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: sudo apt-get install -y -qq ffmpeg

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install funasr
          mkdir -p /tmp/recordings /tmp/transcripts

      - name: 执行转写
        run: python transcriber.py
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANSCRIBE_DIR: /tmp/transcripts

      - name: 上传转写结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: /tmp/transcripts/
          retention-days: 90
          if-no-files-found: ignore
