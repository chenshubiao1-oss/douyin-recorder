name: test-api-endpoints
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          RID="344763580"
          echo "=== Method 1: live.douyin.com SSR ==="
          curl -s -L --max-time 10 -H "User-Agent: Mozilla/5.0" "https://live.douyin.com/${RID}" | wc -c
          echo ""
          echo "=== Method 2: webcast/room/web/enter ==="
          curl -s --max-time 10 "https://live.douyin.com/webcast/room/web/enter/?room_id=${RID}&type_id=0" | head -c 500
          echo ""
          echo "=== Method 3: webcast/room/reflow/info ==="
          curl -s --max-time 10 "https://webcast.amemv.com/webcast/room/reflow/info/?room_id=${RID}&type_id=0" | head -c 500
          echo ""
          echo "=== Method 4: www.douyin.com live api ==="
          curl -s -L --max-time 10 "https://www.douyin.com/aweme/v1/web/live/home/?web_rid=${RID}" | head -c 500
          echo ""
          echo "=== Method 5: webcast with web_rid ==="
          curl -s -L --max-time 10 "https://live.douyin.com/webcast/room/web/enter/?web_rid=${RID}" | head -c 500
