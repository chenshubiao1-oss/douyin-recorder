name: test-ssr-loop
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          echo "=== Testing SSR detection loop on Actions ==="
          for i in $(seq 1 30); do
            # Get SSR HTML and check for flv_pull_url
            body=$(curl -s --max-time 10 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36 Edg/148.0.0.0" -H "Referer: https://www.douyin.com/" "https://live.douyin.com/319074168229" 2>/dev/null)
            len=${#body}
            has_flv=0
            if echo "$body" | grep -q 'flv_pull_url'; then
              has_flv=1
            fi
            echo "Round $i: len=$len flv=$has_flv"
            sleep 10
          done
