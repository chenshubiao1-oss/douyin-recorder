name: Test room 229675153508
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: curl room 229675153508
        run: |
          rid="229675153508"
          echo "Testing: $rid"
          curl -s -L --max-time 25 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8" \
            "https://live.douyin.com/$rid" -o /tmp/test2296.html
          echo "Size: $(wc -c < /tmp/test2296.html)"
          grep -o "flv_pull_url" /tmp/test2296.html || echo "flv_pull_url NOT FOUND"
          grep -oP 'web_stream_url[^,]*null' /tmp/test2296.html && echo "web_stream_url IS null" || echo "web_stream_url NOT null"
          grep -oP 'data-cluster="[^"]*"' /tmp/test2296.html || echo "NO CLUSTER"
