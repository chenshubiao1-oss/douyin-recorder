name: 转录ArtifactWAV

on:
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg unzip

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu --prefer-binary --timeout 60
          pip install funasr requests --prefer-binary --timeout 60

      - name: 下载并提取Artifact
        run: |
          mkdir -p /tmp/artifact /tmp/transcripts
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/6970939333/zip" \
            -o /tmp/artifact.zip
          unzip -o /tmp/artifact.zip -d /tmp/artifact/ 2>/dev/null

      - name: 查找WAV并转录
        run: |
          python3 << 'PYEOF'
import os, sys, glob
sys.path.insert(0, '.')
from transcriber import transcribe

wav_dir = '/tmp/artifact'
wavs = glob.glob(os.path.join(wav_dir, '**', '*.wav'), recursive=True)
print(f'找到 {len(wavs)} 个WAV文件')
for w in wavs:
    print(f'  {os.path.basename(w)} ({os.path.getsize(w)/1024/1024:.1f}MB)')

for wav_path in wavs:
    print(f'\n转录: {os.path.basename(wav_path)}')
    try:
        txt_path, srt_path = transcribe(wav_path)
        print(f'  TXT: {os.path.basename(txt_path)}')
        print(f'  SRT: {os.path.basename(srt_path)}')
        
        # Upload to Release
        import urllib.request, json
        token = os.environ.get('GITHUB_TOKEN', '')
        repo = os.environ.get('GITHUB_REPOSITORY', '')
        h = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json'}
        
        base_name = os.path.splitext(os.path.basename(wav_path))[0]
        for fp, ext in [(txt_path, 'txt'), (srt_path, 'srt')]:
            with open(fp, 'rb') as fr:
                data = fr.read()
            fname = base_name + '.' + ext
            
            # Get release
            req = urllib.request.Request('https://api.github.com/repos/' + repo + '/releases?per_page=5', headers=h)
            releases = json.loads(urllib.request.urlopen(req).read())
            rel_id = None
            for rel in releases:
                if rel.get('tag_name', '') == 'rec-20260513':
                    rel_id = rel['id']
                    break
            if not rel_id:
                d2 = json.dumps({'tag_name': 'rec-20260513', 'name': 'rec-20260513'}).encode()
                req2 = urllib.request.Request('https://api.github.com/repos/' + repo + '/releases',
                    data=d2, headers={**h, 'Content-Type': 'application/json'}, method='POST')
                rel_id = json.loads(urllib.request.urlopen(req2).read())['id']
            
            upload_url = 'https://uploads.github.com/repos/' + repo + '/releases/' + str(rel_id) + '/assets?name=' + urllib.request.quote(fname)
            req3 = urllib.request.Request(upload_url, data=data, headers={**h, 'Content-Type': 'application/octet-stream'}, method='POST')
            json.loads(urllib.request.urlopen(req3).read())
            print(f'  上传: {fname} ({len(data)/1024:.1f}KB)')
    except Exception as e:
        print(f'  失败: {str(e)[:100]}')
PYEOF

      - name: 上传转录结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcribe-artifact-result
          path: /tmp/transcripts/
          retention-days: 30
          if-no-files-found: ignore
