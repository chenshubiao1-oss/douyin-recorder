name: Test record 97171913600
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install -q -r requirements.txt 2>$null || echo "no deps"
      - name: Run test
        run: python3 test_9717.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
