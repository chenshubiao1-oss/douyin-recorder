name: quick-test-record
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Record live 319074168229 for 10 min
        run: |
          python3 -c "
import urllib.request, subprocess, time, re

url = 'https://live.douyin.com/319074168229'
for i in range(10):
    req = urllib.request.Request(url, headers={
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
        'Referer': 'https://www.douyin.com/'
    })
    r = urllib.request.urlopen(req, timeout=10)
    html = r.read().decode('utf-8', errors='replace')
    has_flv = 'flv_pull_url' in html
    print(f'Round {i+1}: len={len(html)} flv={has_flv}')
    if has_flv:
        for m in re.finditer(r'["\\]+(FULL_HD1)["\\]+\s*[:=]\s*["\\]+(https?://[^"]+)', html):
            flv = m.group(2).replace('\\/', '/').replace('\\u0026', '&')
            print(f'FLV URL: {flv[:120]}')
            # Try ffmpeg 5 sec record
            result = subprocess.run(['ffmpeg', '-y', '-loglevel', 'error',
                '-headers', 'User-Agent: Mozilla/5.0\r\nReferer: https://live.douyin.com/\r\n',
                '-i', flv, '-t', '10', '-c', 'copy', '/tmp/test_seg.mp4'],
                capture_output=True, timeout=20)
            if result.returncode == 0:
                import os
                size = os.path.getsize('/tmp/test_seg.mp4')
                print(f'ffmpeg OK: {size} bytes')
            else:
                err = result.stderr.decode()[:200]
                print(f'ffmpeg failed: {err}')
            break
    time.sleep(60)
print('DONE')
"
