name: 24h连续监控
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'  # TH 01:00
    - cron: '0 23 * * *'  # TH 06:00
    - cron: '0 4 * * *'   # TH 11:00
    - cron: '0 9 * * *'   # TH 16:00
    - cron: '0 14 * * *'  # TH 21:00

env:
  PYTHON_VERSION: '3.11'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装依赖
        run: |
          pip install playwright requests
          python -m playwright install chromium
          sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/recordings

      - name: 启动监控录制 (最长5.5小时)
        run: python recorder.py
        env:
          CHECK_INTERVAL: 15
