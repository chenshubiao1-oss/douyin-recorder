name: 24h连续监控

on:
  workflow_dispatch:
  repository_dispatch:
    types: [record_lives]
  schedule:
    - cron: '0 22 * * *'
    - cron: '30 2 * * *'
    - cron: '0 7 * * *'
    - cron: '30 11 * * *'
    - cron: '0 16 * * *'
    - cron: '30 20 * * *'

env:
  PYTHON_VERSION: '3.11'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/modelscope
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: deps-v3-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-
            deps-v3-
            deps-
            dep-
            de
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --timeout 120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 playwright
          pip install --timeout 120 funasr
          pip install --timeout 120 requests
          python -m playwright install chromium --with-deps
          mkdir -p /tmp/recordings /tmp/transcripts
      - name: Show TH time
        run: |
          echo 'GitHub UTC: ' $(date -u '+%Y-%m-%d %H:%M:%S')
          echo 'Thailand:  ' $(TZ='Asia/Bangkok' date '+%Y-%m-%d %H:%M:%S')
      - name: Run recorder
        run: python recorder.py
        env:
          CHECK_INTERVAL: 15
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
          TEST_MODE: ${{ github.event.inputs.test_mode || '' }}
          TEST_ROOM: ${{ github.event.inputs.test_room || '344763580' }}
          TEST_DURATION: ${{ github.event.inputs.test_duration || '60' }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      - name: Fallback upload to Release (dedup)
        if: always()
        run: python3 -c """
import os, json, urllib.request
token = '${{ secrets.GITHUB_TOKEN }}'
repo = '${{ github.repository }}'
run_id = '${{ github.run_id }}'
gh = {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token}
existing = set(); page = 1
while True:
    try:
        r = json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+'/releases?per_page=100&page='+str(page), headers=gh)).read())
    except: break
    if not r: break
    for rel in r:
        for a in rel.get('assets', []): existing.add(a['name'])
    page += 1
d = '/tmp/recordings/'
if not os.path.exists(d): exit(0)
release_url = None
try:
    r = json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+'/releases/tags/rec-'+run_id, headers=gh)).read())
    release_url = r.get('upload_url','').split('{')[0]
except:
    try:
        r = json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+'/releases',
            data=json.dumps({'tag_name':'rec-'+run_id,'name':'rec-'+run_id,'body':'','draft':False,'prerelease':True}).encode(),
            headers={**gh,'Content-Type':'application/json'}, method='POST')).read())
        release_url = r.get('upload_url','').split('{')[0]
    except: pass
if not release_url: exit(0)
for fn in os.listdir(d):
    fp = os.path.join(d, fn)
    if not os.path.isfile(fp) or fn in existing:
        if fn in existing: print('SKIP:', fn)
        continue
    data = open(fp, 'rb').read()
    url = release_url + '?name=' + urllib.parse.quote(fn)
    try:
        urllib.request.urlopen(urllib.request.Request(url, data=data, headers={**gh,'Content-Type':'application/octet-stream'}, method='POST'))
        print('OK:', fn, len(data)//1024//1024, 'MB')
    except Exception as e:
        print('FAIL:', fn, e)
"""
