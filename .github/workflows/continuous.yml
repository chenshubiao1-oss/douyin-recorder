name: 24h连续监控

on:
  workflow_dispatch:
  repository_dispatch:
    types: [record_lives]
  schedule:
    - cron: '0 22 * * *'
    - cron: '30 2 * * *'
    - cron: '0 7 * * *'
    - cron: '30 11 * * *'
    - cron: '0 16 * * *'
    - cron: '30 20 * * *'

env:
  PYTHON_VERSION: '3.11'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/modelscope
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: deps-v3-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-
            deps-v3-
            deps-
            dep-
            de
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --timeout 120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 playwright
          pip install --timeout 120 funasr
          pip install --timeout 120 requests
          python -m playwright install chromium --with-deps
          mkdir -p /tmp/recordings /tmp/transcripts
      - name: Show TH time
        run: |
          echo 'GitHub UTC: ' $(date -u '+%Y-%m-%d %H:%M:%S')
          echo 'Thailand:  ' $(TZ='Asia/Bangkok' date '+%Y-%m-%d %H:%M:%S')
      - name: Run recorder
        run: python recorder.py
        env:
          CHECK_INTERVAL: 15
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
          TEST_MODE: ${{ github.event.inputs.test_mode || '' }}
          TEST_ROOM: ${{ github.event.inputs.test_room || '344763580' }}
          TEST_DURATION: ${{ github.event.inputs.test_duration || '60' }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
