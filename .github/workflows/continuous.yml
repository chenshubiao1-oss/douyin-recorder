name: 24h连续监控

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式: 录制60秒+转写'
        required: false
        default: ''
      test_room:
        description: '测试房间ID'
        required: false
        default: '198953345595'
      test_duration:
        description: '测试录制时长(秒)'
        required: false
        default: '60'

  schedule:
    # 每4.5小时触发一次，每轮跑5小时，保证30分钟重叠
    - cron: '0 3 * * *'   # 泰国10:00 = UTC 03:00 (临时新增)
    - cron: '0 22 * * *'  # 泰国05:00 = UTC 22:00
    - cron: '30 2 * * *'  # 泰国09:30 = UTC 02:30
    - cron: '0 7 * * *'   # 泰国14:00 = UTC 07:00
    - cron: '30 11 * * *' # 泰国18:30 = UTC 11:30
    - cron: '0 16 * * *'  # 泰国23:00 = UTC 16:00
    - cron: '30 20 * * *' # 泰国03:30 = UTC 20:30

env:
  PYTHON_VERSION: '3.11'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存依赖+模型
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/modelscope
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: deps-v3-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-
            deps-v3-
            deps-
            dep-
            de

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          # 每个包单独装，不加版本号（从缓存恢复），不加 --prefer-binary（避免依赖解析OOM）
          pip install --timeout 120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 playwright
          pip install --timeout 120 funasr
          pip install --timeout 120 requests
          python -m playwright install chromium --with-deps
          mkdir -p /tmp/recordings /tmp/transcripts

      - name: 显示泰国时间
        run: |
          echo 'GitHub 时间(UTC):' $(date -u '+%Y-%m-%d %H:%M:%S')
          echo '泰国时间(UTC+7):' $(TZ='Asia/Bangkok' date '+%Y-%m-%d %H:%M:%S')
          echo '录制开始于泰国时间——日志里 Python 打的时间已经是泰国时间'

      - name: 启动监控录制
        run: python recorder.py
        env:
          CHECK_INTERVAL: 15
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
          TEST_MODE: ${{ github.event.inputs.test_mode || '' }}
          TEST_ROOM: ${{ github.event.inputs.test_room || '344763580' }}
          TEST_DURATION: ${{ github.event.inputs.test_duration || '60' }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}

      - name: 上传录制文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/recordings/
          retention-days: 90
          if-no-files-found: ignore

      - name: 上传转写结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: /tmp/transcripts/
          retention-days: 90
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    needs: record
    if: always() && needs.record.result == 'cancelled'
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存恢复+模型
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/modelscope
            ~/.cache/huggingface
          key: deps-v3-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-
            deps-v3-
            deps-
            dep-
            de

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install --timeout 120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 funasr
          pip install --timeout 120 requests

      - name: 下载已录制音频
        uses: actions/download-artifact@v4
        with:
          name: douyin-${{ github.run_id }}-1
          path: /tmp/recordings/

      - name: 转录未处理音频
        run: |
          python -c "
import os, sys
sys.path.insert(0, '.')
from transcriber import transcribe
audio_dir = '/tmp/recordings'
if not os.path.exists(audio_dir):
    print('没有录制文件')
    sys.exit(0)
for f in os.listdir(audio_dir):
    if f.endswith('.wav'):
        wav_path = os.path.join(audio_dir, f)
        base = f[:-4]
        srt_path = os.path.join(audio_dir, base + '.srt')
        if os.path.exists(srt_path):
            continue
        print('转录:', f)
        try:
            txt_path, srt_path = transcribe(wav_path)
            if txt_path and os.path.exists(txt_path):
                import shutil
                shutil.copy(txt_path, os.path.join(audio_dir, os.path.basename(txt_path)))
                shutil.copy(srt_path, os.path.join(audio_dir, os.path.basename(srt_path)))
            print('转录完成:', f)
        except Exception as e:
            print('转录失败:', e)
"

      - name: 上传转录文件到Release
        run: |
          python -c "
import os, glob, urllib.request, json
token = '${{ secrets.GITHUB_TOKEN }}'
repo = '${{ github.repository }}'
date = '${{ github.run_id }}'
for f in glob.glob('/tmp/recordings/*.txt') + glob.glob('/tmp/recordings/*.srt'):
    if not os.path.exists(f): continue
    fsize = os.path.getsize(f)
    fname = os.path.basename(f)
    import urllib.parse
    safe_fname = urllib.parse.quote(fname.encode('utf-8'))
    tag = 'cleanup-' + date
    headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}
    d = json.dumps({'tag_name': tag, 'name': tag, 'body': 'post-cancel transcription', 'target_commitish': 'main'}).encode()
    try:
        req = urllib.request.Request('https://api.github.com/repos/' + repo + '/releases', data=d, headers=headers, method='POST')
        rel = json.loads(urllib.request.urlopen(req, timeout=30).read())
    except:
        req = urllib.request.Request('https://api.github.com/repos/' + repo + '/releases/tags/' + tag, headers=headers)
        rel = json.loads(urllib.request.urlopen(req, timeout=30).read())
    upload_url = rel['upload_url'].replace('{?name,label}', '?name=' + safe_fname)
    with open(f, 'rb') as fh:
        data = fh.read()
    uh = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/octet-stream', 'Content-Length': str(len(data))}
    urllib.request.urlopen(urllib.request.Request(upload_url, data=data, headers=uh, method='POST'), timeout=300)
    print('Uploaded:', fname, fsize)
"

      - name: 上传转录文件到Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-transcripts-${{ github.run_id }}
          path: /tmp/recordings/*.txt /tmp/recordings/*.srt
          retention-days: 90
          if-no-files-found: ignore
