name: 24h连续监控

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式: 录制60秒+转写'
        required: false
        default: ''
      test_room:
        description: '测试房间ID'
        required: false
        default: '198953345595'
      test_duration:
        description: '测试录制时长(秒)'
        required: false
        default: '60'

  schedule:
    # 每 3.5 小时触发一次，每轮跑4小时，保证30分钟重叠
    - cron: '0 22 * * *'  # 泰国05:00 = UTC 22:00
    - cron: '30 1 * * *'  # 泰国08:30 = UTC 01:30
    - cron: '0 5 * * *'   # 泰国12:00 = UTC 05:00
    - cron: '30 8 * * *'  # 泰国15:30 = UTC 08:30
    - cron: '0 12 * * *'  # 泰国19:00 = UTC 12:00
    - cron: '30 15 * * *' # 泰国22:30 = UTC 15:30

env:
  PYTHON_VERSION: '3.11'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存依赖+模型
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/modelscope
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: deps-v3-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-
            deps-v3-
            deps-
            dep-
            de

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          # 每个包单独装，不加版本号（从缓存恢复），不加 --prefer-binary（避免依赖解析OOM）
          pip install --timeout 120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 playwright
          pip install --timeout 120 funasr
          pip install --timeout 120 requests
          python -m playwright install chromium --with-deps
          mkdir -p /tmp/recordings /tmp/transcripts

      - name: 显示泰国时间
        run: |
          echo 'GitHub 时间(UTC):' $(date -u '+%Y-%m-%d %H:%M:%S')
          echo '泰国时间(UTC+7):' $(TZ='Asia/Bangkok' date '+%Y-%m-%d %H:%M:%S')
          echo '录制开始于泰国时间——日志里 Python 打的时间已经是泰国时间'

      - name: 启动监控录制
        run: python recorder.py
        env:
          CHECK_INTERVAL: 15
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
          TEST_MODE: ${{ github.event.inputs.test_mode || '' }}
          TEST_ROOM: ${{ github.event.inputs.test_room || '344763580' }}
          TEST_DURATION: ${{ github.event.inputs.test_duration || '60' }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}

      - name: 上传录制文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/recordings/
          retention-days: 90
          if-no-files-found: ignore

      - name: 上传转写结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: /tmp/transcripts/
          retention-days: 90
          if-no-files-found: ignore
