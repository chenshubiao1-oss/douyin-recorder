name: 24h连续监控

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式: 录制60秒+转写'
        required: false
        default: ''
      test_room:
        description: '测试房间ID'
        required: false
        default: '198953345595'

  schedule:
    - cron: '0 1 * * *'

env:
  PYTHON_VERSION: '3.11'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存依赖+模型
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/modelscope
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: deps-v3-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu --no-build-isolation
          pip install playwright==1.53.2 funasr==1.3.1 --no-build-isolation
          python -m playwright install chromium --with-deps
          mkdir -p /tmp/recordings /tmp/transcripts

      - name: 启动监控录制
        run: python recorder.py
        env:
          CHECK_INTERVAL: 15
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
          TEST_MODE: ${{ github.event.inputs.test_mode || '' }}
          TEST_ROOM: ${{ github.event.inputs.test_room || '344763580' }}

      - name: 上传录制文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/recordings/
          retention-days: 90
          if-no-files-found: ignore

      - name: 上传转写结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: /tmp/transcripts/
          retention-days: 90
          if-no-files-found: ignore
