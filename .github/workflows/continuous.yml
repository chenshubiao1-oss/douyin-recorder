name: 24h连续监控

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式: 录制60秒+转写'
        required: false
        default: ''
      test_room:
        description: '测试房间ID'
        required: false
        default: '198953345595'
      test_duration:
        description: '测试录制时长(秒)'
        required: false
        default: '60'

  schedule:
    - cron: '0 22 * * *'  # 泰国05:00 = UTC 22:00
    - cron: '30 2 * * *'  # 泰国09:30 = UTC 02:30
    - cron: '0 7 * * *'   # 泰国14:00 = UTC 07:00
    - cron: '30 11 * * *' # 泰国18:30 = UTC 11:30
    - cron: '0 16 * * *'  # 泰国23:00 = UTC 16:00
    - cron: '30 20 * * *' # 泰国03:30 = UTC 20:30

env:
  PYTHON_VERSION: '3.11'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/modelscope
            ~/.cache/huggingface
            ~/.cache/ms-playwright
          key: deps-v3-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-
            deps-v3-
            deps-
            dep-
            de
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --timeout 120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 playwright
          pip install --timeout 120 funasr
          pip install --timeout 120 requests
          python -m playwright install chromium --with-deps
          mkdir -p /tmp/recordings /tmp/transcripts
      - name: Show TH time
        run: |
          echo 'GitHub UTC: ' $(date -u '+%Y-%m-%d %H:%M:%S')
          echo 'Thailand:  ' $(TZ='Asia/Bangkok' date '+%Y-%m-%d %H:%M:%S')
      - name: Run recorder
        run: python recorder.py
        env:
          CHECK_INTERVAL: 15
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
          TEST_MODE: ${{ github.event.inputs.test_mode || '' }}
          TEST_ROOM: ${{ github.event.inputs.test_room || '344763580' }}
          TEST_DURATION: ${{ github.event.inputs.test_duration || '60' }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/recordings/
          retention-days: 90
          if-no-files-found: ignore
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.run_id }}
          path: /tmp/transcripts/
          retention-days: 90
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-latest
    needs: record
    if: always() && needs.record.result == 'cancelled'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/modelscope
            ~/.cache/huggingface
          key: deps-v3-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            deps-v3-${{ runner.os }}-
            deps-v3-
            deps-
            dep-
            de
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install --timeout 120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --timeout 120 funasr
          pip install --timeout 120 requests
      - name: Download recordings artifact
        uses: actions/download-artifact@v4
        with:
          name: douyin-${{ github.run_id }}-1
          path: /tmp/recordings/
      - name: Transcribe orphan audio
        run: |
          python -c "
import os, sys
sys.path.insert(0, '.')
from transcriber import transcribe
d = '/tmp/recordings'
if not os.path.exists(d): sys.exit(0)
for f in os.listdir(d):
    if f.endswith('.wav'):print('Transcribing:', f);txt,srt=transcribe(os.path.join(d,f));print('Done:',f)
" 2>&1
      - name: Upload transcribed files to Release
        run: |
          python -c "
import os, glob, urllib.request, json, urllib.parse
token = '${{ secrets.GITHUB_TOKEN }}'
repo = '${{ github.repository }}'
tag = 'cleanup-${{ github.run_id }}'
for f in glob.glob('/tmp/recordings/*.txt') + glob.glob('/tmp/recordings/*.srt'):
    if not os.path.exists(f): continue
    n = os.path.basename(f)
    safe = urllib.parse.quote(n.encode('utf-8'))
    hd = {'Authorization':'Bearer '+token,'Content-Type':'application/json'}
    try:
        r = json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+'/releases',
            data=json.dumps({'tag_name':tag,'name':tag,'body':'post-cancel','target_commitish':'main'}).encode(),
            headers=hd,method='POST'),timeout=30).read())
    except:
        r = json.loads(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+'/releases/tags/'+tag,headers=hd),timeout=30).read())
    u = r['upload_url'].replace('{?name,label}','?name='+safe)
    with open(f,'rb') as fh: d = fh.read()
    urllib.request.urlopen(urllib.request.Request(u,data=d,headers={'Authorization':'Bearer '+token,'Content-Type':'application/octet-stream'},method='POST'),timeout=300)
    print('Uploaded:', n)
" 2>&1
      - name: Upload transcribed files to Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-transcripts-${{ github.run_id }}
          path: /tmp/recordings/*.txt /tmp/recordings/*.srt
          retention-days: 90
          if-no-files-found: ignore
