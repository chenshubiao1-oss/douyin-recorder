name: Test curl on Actions
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test douyin curl
        run: |
          echo "=== Test 1: Minimal curl ==="
          curl -s -L --max-time 25 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Accept: text/html" "https://live.douyin.com/673814862790" -o /tmp/t1.html
          echo "Size: $(wc -c < /tmp/t1.html)"
          grep -o "flv_pull_url" /tmp/t1.html && echo "flv_pull_url: FOUND" || echo "flv_pull_url: NOT FOUND"
          grep -oP 'data-cluster="[^"]*"' /tmp/t1.html || echo "NO CLUSTER"
          echo "First 200 chars:"
          head -c 200 /tmp/t1.html
          echo ""
          echo "=== Test 2: X-Forwarded-For ==="
          curl -s -L --max-time 25 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Accept: text/html" -H "X-Forwarded-For: 58.33.200.1" "https://live.douyin.com/673814862790" -o /tmp/t2.html
          echo "Size: $(wc -c < /tmp/t2.html)"
          grep -o "flv_pull_url" /tmp/t2.html && echo "flv_pull_url: FOUND" || echo "flv_pull_url: NOT FOUND"
          head -c 200 /tmp/t2.html
          echo ""
          echo "=== Test 3: Cookie ==="
          curl -s -L --max-time 25 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Accept: text/html" -H "Cookie: ttwid=1%7CwPcX99XHfWkYs9JBqhma96gL4G7TIqv2wAEzVBtR6zw%7C1778989096%7Cf3244cece7393ea380a47be86334fa5a2e173f9435a83191cbb1d710d53b5b98" "https://live.douyin.com/673814862790" -o /tmp/t3.html
          echo "Size: $(wc -c < /tmp/t3.html)"
          grep -o "flv_pull_url" /tmp/t3.html && echo "flv_pull_url: FOUND" || echo "flv_pull_url: NOT FOUND"
          head -c 200 /tmp/t3.html
          echo ""
          echo "=== Test 4: Full browser + XFF ==="
          curl -s -L --max-time 25 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: zh-CN,zh;q=0.9,en;q=0.8" -H "X-Forwarded-For: 58.33.200.1" -H "Connection: keep-alive" -H "Upgrade-Insecure-Requests: 1" "https://live.douyin.com/673814862790" -o /tmp/t4.html
          echo "Size: $(wc -c < /tmp/t4.html)"
          grep -o "flv_pull_url" /tmp/t4.html && echo "flv_pull_url: FOUND" || echo "flv_pull_url: NOT FOUND"
          grep -oP 'data-cluster="[^"]*"' /tmp/t4.html || echo "NO CLUSTER"
          head -c 200 /tmp/t4.html
